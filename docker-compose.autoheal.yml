## Docker Compose v2 — restart unhealthy labeled containers (willfarrell/autoheal).
## Restarts containers labeled autoheal=true (HA, victron_ble2mqtt, sungold, bms_supervisor, Pi5 AdGuard).
## Compose restart: unless-stopped handles exits; healthcheck + autoheal handles wedged processes.
## On .105: run this compose file next to homeassistant; do not use scripts/deploy.sh.
## On Pi5: scripts/deploy_pi5.sh starts this file when ENABLE_AUTOHEAL=1. Do not use --remove-orphans.
## Ref: https://docs.docker.com/reference/compose-file/services/#healthcheck
services:
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
