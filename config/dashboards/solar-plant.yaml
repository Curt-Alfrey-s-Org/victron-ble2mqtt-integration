                {%- macro sock_name(s) -%}{%- set b = ['', 'unknown', 'unavailable', 'none'] -%}{%- set p = s[:4] -%}{%- set tag = p | upper ~ ' ' ~ s[5:] -%}{%- set l = states('input_text.h5082_' ~ s ~ '_load') | trim -%}{%- set w = states('input_text.h5082_' ~ p ~ '_location') | trim -%}{{ (l ~ ' (' ~ tag ~ ')') if l not in b else tag }}{{ (' at ' ~ w) if w not in b else '' }}{%- endmacro -%}
                [
                {%- for e in [
                  'input_select.h5082_2f9d_left_inverter', 'input_select.h5082_2f9d_right_inverter',
                  'input_select.h5082_3013_left_inverter', 'input_select.h5082_3013_right_inverter',
                  'input_select.h5082_3ec9_left_inverter', 'input_select.h5082_3ec9_right_inverter',
                  'input_select.h5082_82fb_left_inverter', 'input_select.h5082_82fb_right_inverter',
                  'input_select.h5082_9607_left_inverter', 'input_select.h5082_9607_right_inverter',
                  'input_select.h5082_c061_left_inverter', 'input_select.h5082_c061_right_inverter',
                  'input_select.h5082_c38d_left_inverter', 'input_select.h5082_c38d_right_inverter',
                  'input_select.h5082_cf79_left_inverter', 'input_select.h5082_cf79_right_inverter',
                ] -%}
                {%- set s = e.split('.')[1][6:].rsplit('_', 1)[0] -%}
                {{ {'entity': e, 'name': sock_name(s)} | tojson }}{{ ',' if not loop.last else '' }}
                {%- endfor -%}
                ]
            show_empty: true
            grid_options:
              columns: full

