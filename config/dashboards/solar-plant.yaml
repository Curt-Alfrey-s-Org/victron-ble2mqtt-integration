# Solar plant Lovelace (YAML). Official cards only.
# https://www.home-assistant.io/dashboards/dashboards/#adding-yaml-dashboards
# https://www.home-assistant.io/dashboards/sections/
title: Solar plant
views:
  - title: Now
    path: now
    type: sections
    max_columns: 3
    dense_section_placement: false
    header:
      layout: responsive
      badges_position: bottom
      card:
        type: markdown
        title: Solar plant
        content: >
          One tile per **device sensor** (each entity appears once on this view).
          Victron BLE, Sungold Modbus, EM16. Dump helpers live under **Dump** sections.
          **power-sankey** uses Energy dashboard config only.
    badges:
      - type: entity
        entity: sensor.battery_1_state_of_charge
        name: T2 SoC
        show_name: true
      - type: entity
        entity: sensor.battery_2_state_of_charge
        name: KU SoC
        show_name: true
      - type: entity
        entity: sensor.sungold_sph302480a_battery_soc
        name: Sungold SoC
        show_name: true
      - type: entity
        entity: sensor.nws_watauga_lake_alerts
        name: NWS
        show_name: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Power flow
          - type: power-sankey
            title: Power flow
            layout: auto
            collection_key: energy_dashboard
            group_by_area: false
            group_by_floor: false
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: T2 24 V
          - type: tile
            entity: sensor.solar_controller_solar
            name: MPPT W
          - type: tile
            entity: sensor.solar_controller_charge_state
            name: Charge
          - type: tile
            entity: sensor.solar_controller_charging_power
            name: Charge W
          - type: tile
            entity: sensor.solar_controller_yield_today
            name: Yield today
          - type: tile
            entity: sensor.battery_1_power
            name: Batt 1 W
          - type: tile
            entity: sensor.battery_1_voltage
            name: Batt 1 V
          - type: tile
            entity: sensor.battery_1_current
            name: Batt 1 A
          - type: tile
            entity: sensor.battery_1_consumed_ah
            name: Consumed Ah
          - type: tile
            entity: sensor.battery_1_remaining_minutes
            name: Remaining min
          - type: tile
            entity: sensor.battery_1_rssi
            name: RSSI

      - type: grid
        cards:
          - type: heading
            heading: KU 24 V
          - type: tile
            entity: sensor.battery_2_power
            name: Batt 2 W
          - type: tile
            entity: sensor.battery_2_voltage
            name: Batt 2 V
          - type: tile
            entity: sensor.battery_2_current
            name: Batt 2 A
          - type: tile
            entity: sensor.battery_2_consumed_ah
            name: Consumed Ah
          - type: tile
            entity: sensor.battery_2_remaining_minutes
            name: Remaining min
          - type: tile
            entity: sensor.battery_2_rssi
            name: RSSI

      - type: grid
        cards:
          - type: heading
            heading: KU outlet to Sungold
          - type: tile
            entity: sensor.em16_a3_power
            name: EM16 A3 W
          - type: tile
            entity: sensor.em16_b3_power
            name: EM16 B3 W
          - type: tile
            entity: sensor.sungold_sph302480a_grid_voltage
            name: Sungold AC-in V
          - type: tile
            entity: sensor.sungold_sph302480a_grid_current
            name: Sungold AC-in A

      - type: grid
        cards:
          - type: heading
            heading: Sungold
          - type: tile
            entity: sensor.sungold_sph302480a_pv_power
            name: PV W
          - type: tile
            entity: sensor.sungold_sph302480a_pv_voltage
            name: PV V
          - type: tile
            entity: sensor.sungold_sph302480a_pv_current
            name: PV A
          - type: tile
            entity: sensor.sungold_sph302480a_charging_power
            name: Batt in W
          - type: tile
            entity: sensor.sungold_sph302480a_battery_voltage
            name: Batt V
          - type: tile
            entity: sensor.sungold_sph302480a_battery_current
            name: Batt A
          - type: tile
            entity: sensor.sungold_sph302480a_charge_state
            name: Charge state
          - type: tile
            entity: sensor.sungold_sph302480a_inverter_state
            name: Output mode
          - type: tile
            entity: sensor.sungold_sph302480a_load_power
            name: AC out W
          - type: tile
            entity: sensor.sungold_sph302480a_ac_output_voltage
            name: AC out V
          - type: tile
            entity: sensor.sungold_sph302480a_ac_output_frequency
            name: AC out Hz
          - type: tile
            entity: sensor.sungold_sph302480a_load_current
            name: AC out A
          - type: tile
            entity: sensor.sungold_sph302480a_grid_frequency
            name: AC in Hz
          - type: tile
            entity: sensor.sungold_sph302480a_fail_code
            name: Fault
          - type: tile
            entity: binary_sensor.sungold_sph302480a_fault_active
            name: Fault LED
          - type: tile
            entity: sensor.sungold_sph302480a_inverter_error_flags
            name: Error flags

      - type: grid
        cards:
          - type: heading
            heading: Dump
          - type: markdown
            content: >
              Sim dump plugs on Sungold AC out. Helpers and automation gates:
              [DUMP_LOAD_HA_CONTROL.md](https://github.com/Curt-Alfrey-s-Org/victron-ble2mqtt-integration/blob/main/docs/DUMP_LOAD_HA_CONTROL.md).
            grid_options:
              columns: full
          - type: tile
            entity: input_boolean.dump_control_enabled
            name: Automations
            features:
              - type: toggle

      - type: grid
        cards:
          - type: heading
            heading: Dump voltages
          - type: entities
            title: Dump voltages
            show_header_toggle: false
            entities:
              - entity: input_boolean.dump_soc_unsynced
                name: SoC unsynced
              - entity: input_text.dump_notify_service
                name: Notify service
              - entity: input_number.dump_site_confirm_s
                name: Site confirm s
              - entity: input_number.dump_site_delta_min_w
                name: Site delta min W
              - entity: input_number.dump_min_solar_w
                name: Min solar W
              - entity: input_number.dump_min_soc_percent
                name: Min SoC %
              - entity: input_number.dump_float_t2_v
                name: T2 float V
              - entity: input_number.dump_rebulk_t2_v
                name: T2 re-bulk V
              - entity: input_number.dump_float_ku_v
                name: KU float V
              - entity: input_number.dump_rebulk_ku_v
                name: KU re-bulk V
              - entity: input_number.dump_float_sph_v
                name: Sungold float V
              - entity: input_number.dump_rebulk_sph_v
                name: Sungold re-bulk V
              - type: weblink
                name: DUMP_LOAD_HA_CONTROL.md (what this does)
                url: https://github.com/Curt-Alfrey-s-Org/victron-ble2mqtt-integration/blob/main/docs/DUMP_LOAD_HA_CONTROL.md
                icon: mdi:file-document-outline
              - type: weblink
                name: Helpers
                url: /config/helpers
                icon: mdi:tune

      - type: grid
        cards:
          - type: heading
            heading: Dump limits
          - type: entities
            title: Dump limits
            show_header_toggle: false
            entities:
              - entity: input_number.dump_ac_limit_t2_w
                name: T2 AC limit
              - entity: input_number.dump_ac_limit_ku_w
                name: KU AC limit
              - entity: input_number.dump_ac_limit_sph_w
                name: Sungold AC limit
              - entity: input_number.dump_max_discharge_t2_w
                name: T2 max batt discharge
              - entity: input_number.dump_max_discharge_ku_w
                name: KU max batt discharge
              - entity: input_number.dump_max_discharge_sph_w
                name: Sungold max batt discharge

      - type: grid
        cards:
          - type: heading
            heading: Dump dwell
          - type: entities
            title: Dump dwell
            show_header_toggle: false
            entities:
              - entity: timer.dump_plug_1_min_on
                name: 1 min on
              - entity: timer.dump_plug_1_cooldown
                name: 1 cooldown
              - entity: timer.dump_plug_2_min_on
                name: 2 min on
              - entity: timer.dump_plug_2_cooldown
                name: 2 cooldown
              - entity: timer.dump_plug_3_min_on
                name: 3 min on
              - entity: timer.dump_plug_3_cooldown
                name: 3 cooldown
              - entity: timer.dump_plug_4_min_on
                name: 4 min on
              - entity: timer.dump_plug_4_cooldown
                name: 4 cooldown
              - entity: timer.dump_plug_5_min_on
                name: 5 min on
              - entity: timer.dump_plug_5_cooldown
                name: 5 cooldown
              - entity: timer.dump_plug_6_min_on
                name: 6 min on
              - entity: timer.dump_plug_6_cooldown
                name: 6 cooldown
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Dump plugs
          - type: tile
            entity: switch.sim_ac_plug_1
            name: Plug 1
            features:
              - type: toggle
          - type: tile
            entity: switch.sim_ac_plug_2
            name: Plug 2
            features:
              - type: toggle
          - type: tile
            entity: switch.sim_ac_plug_3
            name: Plug 3
            features:
              - type: toggle
          - type: tile
            entity: switch.sim_ac_plug_4
            name: Plug 4
            features:
              - type: toggle
          - type: tile
            entity: switch.sim_ac_plug_5
            name: Plug 5
            features:
              - type: toggle
          - type: tile
            entity: switch.sim_ac_plug_6
            name: Plug 6
            features:
              - type: toggle
          - type: entities
            title: Dump plug wiring
            show_header_toggle: false
            entities:
              - entity: input_text.dump_plug_1_power_entity
                name: 1 power sensor
              - entity: input_select.dump_plug_1_inverter
                name: 1 inverter
              - entity: input_text.dump_plug_2_power_entity
                name: 2 power sensor
              - entity: input_select.dump_plug_2_inverter
                name: 2 inverter
              - entity: input_text.dump_plug_3_power_entity
                name: 3 power sensor
              - entity: input_select.dump_plug_3_inverter
                name: 3 inverter
              - entity: input_text.dump_plug_4_power_entity
                name: 4 power sensor
              - entity: input_select.dump_plug_4_inverter
                name: 4 inverter
              - entity: input_text.dump_plug_5_power_entity
                name: 5 power sensor
              - entity: input_select.dump_plug_5_inverter
                name: 5 inverter
              - entity: input_text.dump_plug_6_power_entity
                name: 6 power sensor
              - entity: input_select.dump_plug_6_inverter
                name: 6 inverter
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: House
          - type: thermostat
            entity: climate.417373300314
            name: Ecobee
            grid_options:
              columns: full
          - type: weather-forecast
            entity: weather.417373300314
            name: Ecobee outdoor
            forecast_type: daily
            show_current: true
            show_forecast: true
            secondary_info_attribute: humidity
            grid_options:
              columns: full
          - type: weather-forecast
            entity: weather.417373300314
            name: Ecobee outdoor hourly
            forecast_type: hourly
            show_current: false
            show_forecast: true
            grid_options:
              columns: full
          - type: markdown
            content: >
              **NWS Watauga Lake** (36.32 N, 82.12 W; Hampton / Carter County).
              Radar **KMRX**. Alerts: {{ states('sensor.nws_watauga_lake_alerts') }}.
              Loop below is the official [standard radar GIF](https://www.weather.gov/radarfaq/).
              Tap it for [KMRX standard radar](https://radar.weather.gov/station/KMRX/standard).
            grid_options:
              columns: full
          - type: picture
            image: https://radar.weather.gov/ridge/standard/KMRX_loop.gif
            alt_text: NWS Morristown KMRX standard radar loop for Watauga Lake
            tap_action:
              action: url
              url_path: https://radar.weather.gov/station/KMRX/standard
            grid_options:
              columns: full
          - type: tile
            entity: sensor.thermo_hygrometer_caaf6f_h5072_75_tempc
            name: Temp
          - type: tile
            entity: sensor.thermo_hygrometer_caaf6f_h5072_75_hum
            name: Humidity
          - type: tile
            entity: sensor.thermo_hygrometer_caaf6f_h5072_75_batt
            name: Battery

  - title: History
    path: history
    type: sections
    max_columns: 3
    dense_section_placement: false
    sections:
      - type: grid
        cards:
          - type: markdown
            content: >
              History graph needs [Recorder](https://www.home-assistant.io/integrations/recorder/)
              and [History](https://www.home-assistant.io/integrations/history/).
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Watts
          - type: history-graph
            title: Watts
            hours_to_show: 72
            entities:
              - entity: sensor.solar_controller_solar
                name: T2 MPPT
              - entity: sensor.battery_1_power
                name: Battery 1
              - entity: sensor.battery_2_power
                name: Battery 2
              - entity: sensor.em16_a3_power
                name: EM16 A3
              - entity: sensor.em16_b3_power
                name: EM16 B3
              - entity: sensor.sungold_sph302480a_load_power
                name: Sungold AC out
              - entity: sensor.sungold_sph302480a_pv_power
                name: Sungold PV
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Watts (chargers)
          - type: history-graph
            title: Watts (chargers)
            hours_to_show: 72
            entities:
              - entity: sensor.solar_controller_charging_power
                name: T2 charge
              - entity: sensor.sungold_sph302480a_charging_power
                name: Sungold charge
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Sim dump plugs
          - type: history-graph
            title: Sim dump plugs
            hours_to_show: 72
            entities:
              - entity: switch.sim_ac_plug_1
                name: 1 fan
              - entity: switch.sim_ac_plug_2
                name: 2 dehumidifier
              - entity: switch.sim_ac_plug_3
                name: 3 water heater
              - entity: switch.sim_ac_plug_4
                name: 4 fan
              - entity: switch.sim_ac_plug_5
                name: 5 fan
              - entity: switch.sim_ac_plug_6
                name: 6 gaming PC
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Hz
          - type: history-graph
            title: Hz
            hours_to_show: 72
            entities:
              - entity: sensor.sungold_sph302480a_grid_frequency
                name: AC in
              - entity: sensor.sungold_sph302480a_ac_output_frequency
                name: AC out
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Volts
          - type: history-graph
            title: Volts
            hours_to_show: 72
            entities:
              - entity: sensor.battery_1_voltage
                name: Battery 1
              - entity: sensor.battery_2_voltage
                name: Battery 2
              - entity: sensor.solar_controller_battery
                name: T2 batt
              - entity: sensor.sungold_sph302480a_battery_voltage
                name: Sungold batt
              - entity: sensor.sungold_sph302480a_pv_voltage
                name: Sungold PV
              - entity: sensor.sungold_sph302480a_grid_voltage
                name: Sungold grid
              - entity: sensor.sungold_sph302480a_ac_output_voltage
                name: Sungold AC out
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Amps
          - type: history-graph
            title: Amps
            hours_to_show: 72
            entities:
              - entity: sensor.battery_1_current
                name: Battery 1
              - entity: sensor.battery_2_current
                name: Battery 2
              - entity: sensor.solar_controller_battery_charging
                name: T2 charge
              - entity: sensor.sungold_sph302480a_battery_current
                name: Sungold batt
              - entity: sensor.sungold_sph302480a_pv_current
                name: Sungold PV
              - entity: sensor.sungold_sph302480a_load_current
                name: Sungold AC out
              - entity: sensor.sungold_sph302480a_grid_current
                name: Sungold grid
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: SoC / %
          - type: history-graph
            title: SoC / %
            hours_to_show: 72
            entities:
              - entity: sensor.battery_1_state_of_charge
                name: Battery 1 SoC
              - entity: sensor.battery_2_state_of_charge
                name: Battery 2 SoC
              - entity: sensor.sungold_sph302480a_battery_soc
                name: Sungold SoC
              - entity: sensor.417373300314_humidity
                name: Ecobee humidity
              - entity: sensor.thermo_hygrometer_caaf6f_h5072_75_hum
                name: Hygrometer hum
              - entity: sensor.thermo_hygrometer_caaf6f_h5072_75_batt
                name: Hygrometer batt
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Temperature
          - type: history-graph
            title: Temperature
            hours_to_show: 72
            entities:
              - entity: sensor.417373300314_temperature
                name: Ecobee temp
              - entity: sensor.thermo_hygrometer_caaf6f_h5072_75_tempc
                name: Hygrometer temp
              - entity: sensor.sungold_sph302480a_battery_temperature
                name: Sungold batt
              - entity: sensor.sungold_sph302480a_temperature_dc_dc
                name: Sungold DC-DC
              - entity: sensor.sungold_sph302480a_temperature_dc_ac
                name: Sungold DC-AC
            grid_options:
              columns: full
