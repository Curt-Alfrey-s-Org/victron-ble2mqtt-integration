# Solar plant Lovelace (YAML). Official cards only.
# https://www.home-assistant.io/dashboards/dashboards/#adding-yaml-dashboards
# https://www.home-assistant.io/dashboards/energy/
title: Solar plant
views:
  - title: Now
    path: now
    cards:
      - type: markdown
        title: Solar plant
        content: >
          Live watts from Home Assistant (Victron MQTT, Refoss, Sungold).
          **power-sankey** fills after **Settings > Dashboards > Energy**
          ([energy cards](https://www.home-assistant.io/dashboards/energy/)).
          Dump ON/OFF is Home Assistant automations (`sim_dump_control.yaml`).
          Victron float + re-bulk voltage (not surplus watts). Dumps off when
          solar stops so packs stay 95%+. Brain / Ask ALFa observe and may
          write helpers; they do not own on/off.
          Use **Dump load HA control** on this page (kill switch). Off = no automatic
          dump. On = float + solar-present automations may toggle sim plugs. The six switches
          below show ticks (header toggle is **manual**). Names that say fan
          on dump plugs are lab dump loads, not the cargo vent or LED.
          **Sungold AC out** is LCD INV OUTPUT LOAD KW (Pi4 plus anything
          on SPH OUTPUT, including dump). **Sungold AC-in** is the trailer
          outlet clamp (SPH cord). Cargo LED and vent fan are ~0.01 W /
          ~0.1 W and are not tiles.
          **KU PV est.** may be negative at night (balance residual, not
          live KU solar). Do not add A3 as utility grid.

      - type: power-sankey
        title: Power flow
        layout: horizontal
        collection_key: energy_dashboard
        group_by_area: false
        group_by_floor: false

      - type: distribution
        title: Instant W
        entities:
          - entity: sensor.solar_controller_solar
            name: T2 MPPT
          - entity: sensor.sungold_sph302480a_load_power
            name: Sungold AC out
          - entity: sensor.sungold_sph302480a_pv_power
            name: Sungold PV
          - entity: sensor.sim_dump_load_power
            name: Sim dump

      - type: glance
        title: T2 24 V
        show_name: true
        show_icon: true
        show_state: true
        columns: 3
        entities:
          - entity: sensor.solar_controller_solar
            name: MPPT W
          - entity: sensor.solar_controller_charge_state
            name: Charge
          - entity: sensor.solar_controller_charging_power
            name: Charge W
          - entity: sensor.solar_controller_yield_today
            name: Yield today
          - entity: sensor.t2_ku_jumper_at_t2_power
            name: Jumper to KU
          - entity: sensor.battery_1_power
            name: Batt 1 W
          - entity: sensor.battery_1_voltage
            name: Batt 1 V
          - entity: sensor.battery_1_current
            name: Batt 1 A
          - entity: sensor.battery_1_state_of_charge
            name: SoC
          - entity: sensor.battery_1_consumed_ah
            name: Consumed Ah
          - entity: sensor.battery_1_remaining_minutes
            name: Remaining min
          - entity: sensor.battery_1_rssi
            name: RSSI
          - entity: sensor.t2_mppt_conversion_loss_power
            name: MPPT loss

      - type: glance
        title: KU 24 V (est. chargers)
        show_name: true
        show_icon: true
        show_state: true
        columns: 3
        entities:
          - entity: sensor.ku_unmetered_pv_est_power
            name: KU PV est.
          - entity: sensor.ku_charger_equal_share_power
            name: KU share est.
          - entity: sensor.t2_ku_jumper_power
            name: Jumper from T2
          - entity: sensor.battery_2_power
            name: Batt 2 W
          - entity: sensor.battery_2_voltage
            name: Batt 2 V
          - entity: sensor.battery_2_current
            name: Batt 2 A
          - entity: sensor.battery_2_state_of_charge
            name: SoC
          - entity: sensor.battery_2_consumed_ah
            name: Consumed Ah
          - entity: sensor.battery_2_remaining_minutes
            name: Remaining min
          - entity: sensor.battery_2_rssi
            name: RSSI

      - type: glance
        title: Sungold
        show_name: true
        show_icon: true
        show_state: true
        columns: 3
        entities:
          - entity: sensor.sungold_sph302480a_pv_power
            name: PV W
          - entity: sensor.sungold_sph302480a_pv_voltage
            name: PV V
          - entity: sensor.sungold_sph302480a_pv_current
            name: PV A
          - entity: sensor.sungold_sph302480a_charging_power
            name: Cart batt
          - entity: sensor.sungold_sph302480a_battery_voltage
            name: Batt V
          - entity: sensor.sungold_sph302480a_battery_current
            name: Batt A
          - entity: sensor.sungold_sph302480a_battery_soc
            name: Batt SoC
          - entity: sensor.sungold_sph302480a_battery_temperature
            name: Batt temp
          - entity: sensor.sungold_sph302480a_charge_state
