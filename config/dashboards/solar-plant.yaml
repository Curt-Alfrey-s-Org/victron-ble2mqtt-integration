          - type: markdown
            content: >
              Kill switch and gate tiles here. Confirm is **site load** after 5 s
              (`dump_site_confirm_s` / `dump_site_delta_min_w`), not indoor plug watts.
              Confirmed plug: 15 min min-on. After off: 10 min cooldown.
              If Load now (Sungold AC-out) stays above Solar now, shed one dump plug
              per minute and text after 10 min (`dump_notify_service`).
              Float/re-bulk, AC limits, and plug wiring are in the sections below.
              Doc: [DUMP_LOAD_HA_CONTROL.md](https://github.com/Curt-Alfrey-s-Org/victron-ble2mqtt-integration/blob/main/docs/DUMP_LOAD_HA_CONTROL.md).
            grid_options:
              columns: full
          - type: tile
