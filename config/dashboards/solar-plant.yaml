# Solar plant Lovelace (YAML). Plug tiles use HACS button-card and auto-entities.
# https://www.home-assistant.io/dashboards/dashboards/#adding-yaml-dashboards
# https://www.home-assistant.io/dashboards/sections/
title: Solar plant
button_card_templates:
  h5082_socket:
    show_name: true
    show_label: true
    show_state: false
    section_mode: true
    size: 28px
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    # The label reads helpers and the socket's hold timer by built-up ids, which
    # button-card cannot detect, so re-render on any change (hold starts just after
    # the switch changes).
    triggers_update: all
    name: |
      [[[
        const id = entity.entity_id.replace("switch.ihoment_h5082_", "");
        const load = states["input_text.h5082_" + id + "_load"];
        const text = load && load.state && load.state !== "unknown" && load.state !== "unavailable" ? load.state : "";
        return text || id.replace("_", " ").toUpperCase();
      ]]]
    label: |
      [[[
        const id = entity.entity_id.replace("switch.ihoment_h5082_", "");
        const plug = id.split("_")[0];
        const where = states["input_text.h5082_" + plug + "_location"];
        const use = states["input_select.h5082_" + id + "_use"];
        const place = where && where.state && where.state !== "unknown" && where.state !== "unavailable" && where.state !== "" ? where.state : plug.toUpperCase();
        const inv = states["input_select.h5082_" + id + "_inverter"];
        const role = inv && inv.state === "House" ? "house" : (use && use.state === "dump" ? "dump" : "normal");
        const heard = states["sensor.h5082_" + plug + "_heard_by"];
        const radio = heard && heard.state && heard.state !== "unknown" && heard.state !== "unavailable" && heard.state !== "none" ? heard.state.split(" ")[0] : "";
        const hold = states["timer.h5082_" + id + "_hold"];
        let held = "";
        if (hold && hold.state === "active" && hold.attributes.finishes_at) {
          const end = new Date(hold.attributes.finishes_at);
          held = " · hold to " + String(end.getHours()).padStart(2, "0") + ":" + String(end.getMinutes()).padStart(2, "0");
        } else if (hold && hold.state === "paused") {
          held = " · hold paused";
        }
        return place + " · " + role + held + (radio ? " · " + radio : "");
      ]]]
    state:
      - value: "on"
        icon: mdi:power-plug
        color: "#3dd68c"
      - value: "off"
        icon: mdi:power-plug-off
        color: "#8b98a5"
    styles:
      card:
        - border-radius: 12px
        - padding: 8px
        - border: |
            [[[
              const id = entity.entity_id.replace("switch.ihoment_h5082_", "");
              const use = states["input_select.h5082_" + id + "_use"];
              const inv = states["input_select.h5082_" + id + "_inverter"];
              const dump = use && use.state === "dump" && !(inv && inv.state === "House");
              return dump ? "2px solid #c9a227" : "1px solid var(--divider-color)";
            ]]]
      name:
        - font-size: 14px
        - font-weight: bold
      label:
        - font-size: 12px
views:
  - title: Now
    path: now
    type: sections
    max_columns: 3
    dense_section_placement: false
    header:
      layout: responsive
      badges_position: bottom
      card:
        type: markdown
        title: Solar plant
        content: >
          One tile per **device sensor** (each entity appears once on this view).
          Victron BLE, Sungold Modbus, EM16. Dump helpers live under **Dump** sections.
          **power-sankey** uses Energy dashboard config only.
    badges:
      - type: entity
        entity: sensor.battery_1_state_of_charge
        name: T2 SoC
        show_name: true
      - type: entity
        entity: sensor.battery_2_state_of_charge
        name: KU SoC
        show_name: true
      - type: entity
        entity: sensor.sungold_sph302480a_battery_soc
        name: Sungold SoC
        show_name: true
      - type: entity
        entity: sensor.nws_watauga_lake_alerts
        name: NWS
        show_name: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Power flow
          - type: power-sankey
            title: Power flow
            layout: auto
            collection_key: energy_dashboard
            group_by_area: false
            group_by_floor: false
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: T2 24 V
          - type: tile
            entity: sensor.solar_controller_solar
            name: MPPT W
          - type: tile
            entity: sensor.solar_controller_charge_state
            name: Charge
          - type: tile
            entity: sensor.solar_controller_charging_power
            name: Charge W
          - type: tile
            entity: sensor.solar_controller_yield_today
            name: Yield today
          - type: tile
            entity: sensor.battery_1_power
            name: Batt 1 W
          - type: tile
            entity: sensor.battery_1_voltage
            name: Batt 1 V
          - type: tile
            entity: sensor.battery_1_current
            name: Batt 1 A
          - type: tile
            entity: sensor.battery_1_consumed_ah
            name: Consumed Ah
          - type: tile
            entity: sensor.battery_1_remaining_minutes
            name: Remaining min
          - type: tile
            entity: sensor.battery_1_rssi
            name: RSSI

      - type: grid
        cards:
          - type: heading
            heading: KU 24 V
          - type: tile
            entity: sensor.battery_2_power
            name: Batt 2 W
          - type: tile
            entity: sensor.battery_2_voltage
            name: Batt 2 V
          - type: tile
            entity: sensor.battery_2_current
            name: Batt 2 A
          - type: tile
            entity: sensor.battery_2_consumed_ah
            name: Consumed Ah
          - type: tile
            entity: sensor.battery_2_remaining_minutes
            name: Remaining min
          - type: tile
            entity: sensor.battery_2_rssi
            name: RSSI

      - type: grid
        cards:
          - type: heading
            heading: KU outlet to Sungold
          - type: tile
            entity: sensor.site_em16_a3_power
            name: EM16 A3 W
          - type: tile
            entity: sensor.site_em16_b3_power
            name: EM16 B3 W
          - type: tile
            entity: sensor.sungold_sph302480a_grid_voltage
            name: Sungold AC-in V
          - type: tile
            entity: sensor.sungold_sph302480a_grid_current
            name: Sungold AC-in A

      - type: grid
        cards:
          - type: heading
            heading: Sungold
          - type: tile
            entity: sensor.sungold_sph302480a_pv_power
            name: PV W
          - type: tile
            entity: sensor.sungold_sph302480a_pv_voltage
            name: PV V
          - type: tile
            entity: sensor.sungold_sph302480a_pv_current
            name: PV A
          - type: tile
            entity: sensor.sungold_sph302480a_charging_power
            name: Batt in W
          - type: tile
            entity: sensor.sungold_sph302480a_battery_voltage
            name: Batt V
          - type: tile
            entity: sensor.sungold_sph302480a_battery_current
            name: Batt A
          - type: tile
            entity: sensor.sungold_sph302480a_charge_state
            name: Charge state
          - type: tile
            entity: sensor.sungold_sph302480a_inverter_state
            name: Output mode
          - type: tile
            entity: sensor.sungold_sph302480a_load_power
            name: AC out W
          - type: tile
            entity: sensor.sungold_sph302480a_ac_output_voltage
            name: AC out V
          - type: tile
            entity: sensor.sungold_sph302480a_ac_output_frequency
            name: AC out Hz
          - type: tile
            entity: sensor.sungold_sph302480a_load_current
            name: AC out A
          - type: tile
            entity: sensor.sungold_sph302480a_grid_frequency
            name: AC in Hz
          - type: tile
            entity: sensor.sungold_sph302480a_fail_code
            name: Fault
          - type: tile
            entity: binary_sensor.sungold_sph302480a_fault_active
            name: Fault LED
          - type: tile
            entity: sensor.sungold_sph302480a_inverter_error_flags
            name: Error flags

      - type: grid
        cards:
          - type: heading
            heading: Dump master switch
            icon: mdi:transmission-tower-export
          - type: markdown
            content: |
              Lets Home Assistant switch dump sockets by itself: **on** = the dump rules run, **off** = HA never switches a dump socket (ones already on stay on until you turn them off).
              Start with it **off**, set Use and Inverter on one test socket, check the numbers below, then turn it on.
              The LOAD button (it asks first) puts every dump number back to the recommended starting values.
              [Help: Dump master switch](https://github.com/Curt-Alfrey-s-Org/victron-ble2mqtt-integration/blob/main/docs/site-solar/dump-master-switch.md)
            grid_options:
              columns: full
          - type: entities
            title: Dump master switch
            show_header_toggle: false
            state_color: true
            entities:
              - entity: input_boolean.dump_control_enabled
                name: Dump load HA control (master switch)
              - type: button
                name: Load recommended starting values
                icon: mdi:backup-restore
                action_name: LOAD
                tap_action:
                  action: perform-action
                  perform_action: script.dump_load_recommended_defaults
                  confirmation:
                    text: >-
                      Replace ALL dump volt, watt, SoC, confirm and manual hold settings
                      with the recommended starting values? Your tuned values will be lost.

      - type: grid
        cards:
          - type: heading
            heading: Dump status (why / why not)
            icon: mdi:list-status
          - type: markdown
            content: |
              Read-only list of every condition the dump rules check, so you can see why HA is or is not adding a dump socket.
              HA adds a socket only when everything under **Whole site** is on, nothing under **Blockers** is on, and that socket's bus shows start volts on, stop volts off and battery ok.
              Nothing to set here.
              [Help: Dump status (why / why not)](https://github.com/Curt-Alfrey-s-Org/victron-ble2mqtt-integration/blob/main/docs/site-solar/dump-status.md)
            grid_options:
              columns: full
          - type: entities
            title: Dump status
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.dump_sockets
                name: Sockets set to dump
              - entity: sensor.dump_next_plug
                name: Next socket HA would add
              - entity: sensor.dump_shed_plug
                name: Next socket HA would shed
              - type: section
                label: Whole site (all must be on to add)
              - entity: binary_sensor.dump_charge_float
                name: T2 charger in float
              - entity: binary_sensor.dump_solar_present
                name: Solar present (T2 PV at/above min solar)
              - entity: binary_sensor.dump_soc_ok
                name: SoC ok (or ignored)
              - entity: sensor.solar_controller_solar
                name: T2 PV now
              - type: section
                label: Blockers (on = stops adding / sheds)
              - entity: binary_sensor.dump_pv_falling
                name: PV falling (blocks adding)
              - entity: binary_sensor.dump_load_exceeds_solar
                name: Sungold load above solar (sheds)
              - entity: binary_sensor.dump_charge_ok
                name: T2 absorption or float (off = sheds)
              - type: section
                label: T2 bus
              - entity: binary_sensor.dump_v_float_t2
                name: T2 at/above start volts
              - entity: binary_sensor.dump_v_rebulk_t2
                name: T2 at/below stop volts (turns off)
              - entity: binary_sensor.dump_batt_t2_ok
                name: T2 battery within discharge limit
              - type: section
                label: KU bus
              - entity: binary_sensor.dump_v_float_ku
                name: KU at/above start volts
              - entity: binary_sensor.dump_v_rebulk_ku
                name: KU at/below stop volts (turns off)
              - entity: binary_sensor.dump_batt_ku_ok
                name: KU battery within discharge limit
              - type: section
                label: Sungold bus
              - entity: binary_sensor.dump_v_float_sph
                name: Sungold at/above start volts
              - entity: binary_sensor.dump_v_rebulk_sph
                name: Sungold at/below stop volts (turns off)
              - entity: binary_sensor.dump_batt_sph_ok
                name: Sungold battery within discharge limit
          - type: markdown
            title: Dump sockets by name (live)
            content: |
              {%- macro sock_name(s) -%}{%- set b = ['', 'unknown', 'unavailable', 'none'] -%}{%- set p = s[:4] -%}{%- set tag = p | upper ~ ' ' ~ s[5:] -%}{%- set l = states('input_text.h5082_' ~ s ~ '_load') | trim -%}{%- set w = states('input_text.h5082_' ~ p ~ '_location') | trim -%}{{ (l ~ ' (' ~ tag ~ ')') if l not in b else tag }}{{ (' at ' ~ w) if w not in b else '' }}{%- endmacro -%}
              {%- set n = states('sensor.dump_next_plug') -%}
              {%- set d = states('sensor.dump_shed_plug') -%}
              **Next to add:** {{ sock_name(n | replace('switch.ihoment_h5082_', '')) if n.startswith('switch.ihoment_h5082_') else 'none' }}

              **Next to shed:** {{ sock_name(d | replace('switch.ihoment_h5082_', '')) if d.startswith('switch.ihoment_h5082_') else 'none' }}

              **Set to dump:**
              {%- set ns = namespace(any=false) %}
              {%- for s in ['2f9d_left', '2f9d_right', '3013_left', '3013_right', '3ec9_left', '3ec9_right', '82fb_left', '82fb_right', '9607_left', '9607_right', 'c061_left', 'c061_right', 'c38d_left', 'c38d_right', 'cf79_left', 'cf79_right'] %}
              {%- if is_state('input_select.h5082_' ~ s ~ '_use', 'dump') %}{% set ns.any = true %}
              {%- if is_state('input_select.h5082_' ~ s ~ '_inverter', 'House') %}
              - {{ sock_name(s) }}: {{ states('switch.ihoment_h5082_' ~ s) }}, House (grid power): never switched by dump control
              {%- else %}
              - {{ sock_name(s) }}: {{ states('switch.ihoment_h5082_' ~ s) }}, {{ states('input_select.h5082_' ~ s ~ '_inverter') }} bus{% if is_state('timer.h5082_' ~ s ~ '_hold', 'active') %}, on hold to {{ as_timestamp(state_attr('timer.h5082_' ~ s ~ '_hold', 'finishes_at')) | timestamp_custom('%H:%M') }}{% endif %}
              {%- endif %}
              {%- endif %}
              {%- endfor %}
              {%- if not ns.any %} none{% endif %}
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Dump voltage (start / stop)
            icon: mdi:battery-arrow-up
          - type: markdown
            content: |
              **Start** volts (float) is the voltage a bus must reach before it gets dump sockets; **stop** volts (re-bulk) turns all of that bus's dump sockets off after 1 minute.
              Raise start = dumping starts later and less often, lower = sooner; raise stop = dumps shut off sooner (safer for the pack), lower = they run longer; keep stop at least 0.2 V below start.
              Safe start: 27.0 V start / 26.8 V stop on every bus, or start = the float voltage set in VictronConnect.
              [Help: Dump voltage (start / stop)](https://github.com/Curt-Alfrey-s-Org/victron-ble2mqtt-integration/blob/main/docs/site-solar/dump-voltage.md)
            grid_options:
              columns: full
          - type: entities
            title: Dump voltage
            show_header_toggle: false
            state_color: true
            entities:
              - type: section
                label: T2 (Battery 1 shunt)
              - entity: input_number.dump_float_t2_v
                name: T2 start volts (float)
              - entity: input_number.dump_rebulk_t2_v
                name: T2 stop volts (re-bulk)
              - type: section
                label: KU (Battery 2 shunt)
              - entity: input_number.dump_float_ku_v
                name: KU start volts (float)
              - entity: input_number.dump_rebulk_ku_v
                name: KU stop volts (re-bulk)
              - type: section
                label: Sungold cart
              - entity: input_number.dump_float_sph_v
                name: Sungold start volts (float)
              - entity: input_number.dump_rebulk_sph_v
                name: Sungold stop volts (re-bulk)

      - type: grid
        cards:
          - type: heading
            heading: Dump start conditions
            icon: mdi:solar-power
          - type: markdown
            content: |
              **Min solar** is the T2 PV watts that mean "sun is up" (below it for 1 minute every dump socket turns off); **Min SoC** blocks adding sockets while T2 SoC is lower, unless **Ignore SoC** is on.
              Raise min solar = dumps stop earlier at dusk or in clouds, lower = they run later (never 0, or night never counts as solar gone); raise min SoC = fewer dump starts.
              Safe start: 50 W, 95 %, Ignore SoC on until the SmartShunt has synced to 100 %.
              [Help: Dump start conditions](https://github.com/Curt-Alfrey-s-Org/victron-ble2mqtt-integration/blob/main/docs/site-solar/dump-start-conditions.md)
            grid_options:
              columns: full
          - type: entities
            title: Dump start conditions
            show_header_toggle: false
            state_color: true
            entities:
              - entity: input_number.dump_min_solar_w
                name: Min solar (below = solar gone)
              - entity: input_number.dump_min_soc_percent
                name: Min T2 SoC to add sockets
              - entity: input_boolean.dump_soc_unsynced
                name: Ignore SoC (shunt not synced)

      - type: grid
        cards:
          - type: heading
            heading: Dump confirm (wait / load rise)
            icon: mdi:timer-sand
          - type: markdown
            content: |
              After turning a dump socket on, HA waits **Confirm wait** seconds and keeps it only if that bus's load rose by **Min load rise** watts; otherwise it turns it off for a 10 minute cooldown.
              Raise the wait = slower but surer, lower = faster; raise the rise = small loads get rejected, lower = meter noise can "confirm" a dead plug.
              Safe start: 5 s and 25 W (or half the watts of your smallest dump load).
              [Help: Dump confirm (wait / load rise)](https://github.com/Curt-Alfrey-s-Org/victron-ble2mqtt-integration/blob/main/docs/site-solar/dump-confirm.md)
            grid_options:
              columns: full
          - type: entities
            title: Dump confirm
            show_header_toggle: false
            state_color: true
            entities:
              - entity: input_number.dump_site_confirm_s
                name: Confirm wait
              - entity: input_number.dump_site_delta_min_w
                name: Confirm min load rise

      - type: grid
        cards:
          - type: heading
            heading: Inverter AC limits
            icon: mdi:current-ac
          - type: markdown
            content: |
              HA adds a dump socket to a bus only while that inverter's present load is under this many watts (T2/KU load is read from battery discharge, Sungold from its AC-out meter); it never turns sockets off.
              Raise = more sockets may go onto a busy inverter, lower = HA stops adding sooner.
              Safe start: 2000 W, or the inverter's continuous rating minus your biggest dump load.
              [Help: Inverter AC limits](https://github.com/Curt-Alfrey-s-Org/victron-ble2mqtt-integration/blob/main/docs/site-solar/dump-inverter-limits.md)
            grid_options:
              columns: full
          - type: entities
            title: Inverter AC limits
            show_header_toggle: false
            state_color: true
            entities:
              - entity: input_number.dump_ac_limit_t2_w
                name: T2 inverter AC limit
              - entity: input_number.dump_ac_limit_ku_w
                name: KU inverter AC limit
              - entity: input_number.dump_ac_limit_sph_w
                name: Sungold inverter AC limit

      - type: grid
        cards:
          - type: heading
            heading: Battery discharge limits
            icon: mdi:battery-minus
          - type: markdown
            content: |
              How many watts a battery may discharge before HA stops adding dump sockets on that bus and, after 1 minute, turns that bus's dump sockets off.
              Raise = tolerate more battery drain, lower = shut off at the first sign of discharge (0 can trip on meter noise).
              Safe start: T2 0 W, KU 0 W, Sungold 50 W; go to 20-50 W only if dumps keep dropping out on noise.
              [Help: Battery discharge limits](https://github.com/Curt-Alfrey-s-Org/victron-ble2mqtt-integration/blob/main/docs/site-solar/dump-battery-limits.md)
            grid_options:
              columns: full
          - type: entities
            title: Battery discharge limits
            show_header_toggle: false
            state_color: true
            entities:
              - entity: input_number.dump_max_discharge_t2_w
                name: T2 max battery discharge
              - entity: input_number.dump_max_discharge_ku_w
                name: KU max battery discharge
              - entity: input_number.dump_max_discharge_sph_w
                name: Sungold max battery discharge

      - type: grid
        cards:
          - type: heading
            heading: Dump alerts
            icon: mdi:message-alert
          - type: markdown
            content: |
              When Sungold load stays above solar for 10 minutes HA posts a notification in HA, and also texts a phone if this box holds its action name (for example `mobile_app_my_phone`).
              Blank or `persistent_notification` = HA notification only; a wrong name only breaks the phone text.
              Safe start: blank, then add your phone's name from Developer tools > Actions (search `notify.mobile_app`).
              [Help: Dump alerts](https://github.com/Curt-Alfrey-s-Org/victron-ble2mqtt-integration/blob/main/docs/site-solar/dump-alerts.md)
            grid_options:
              columns: full
          - type: entities
            title: Dump alerts
            show_header_toggle: false
            state_color: true
            entities:
              - entity: input_text.dump_notify_service
                name: Alert notify service

      - type: grid
        cards:
          - type: heading
            heading: Dump timers (min-on / cooldown)
            icon: mdi:timer-outline
          - type: markdown
            content: |
              Per socket: **cooldown** (10 min) starts every time HA turns a dump socket off, and HA will not turn that socket on again until it is idle; **min-on** (15 min) starts when a socket is confirmed and is display only (no rule waits for it).
              The lengths are fixed in dump_control.yaml, not editable here.
              Watch this box to see why a socket is being skipped.
              [Help: Dump timers (min-on / cooldown)](https://github.com/Curt-Alfrey-s-Org/victron-ble2mqtt-integration/blob/main/docs/site-solar/dump-timers.md)
            grid_options:
              columns: full
          - type: custom:auto-entities
            card:
              type: entities
              title: Dump timers
              show_header_toggle: false
            filter:
              include:
                - entity_id: timer.h5082_*
              exclude:
                - entity_id: timer.h5082_*_hold
            sort:
              method: entity_id
            show_empty: true
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Dump manual hold
            icon: mdi:hand-back-right-outline
          - type: markdown
            content: |
              When a dump socket is switched by hand (Plugs button, the plug's own button, another app), the dump rules leave it alone for **Dump manual hold** minutes, then resume (0 = no hold).
              Hold always stops HA turning that socket **on**; **Hold also blocks turn-offs** on = it also stops solar-gone, stop-volts, battery and shed turn-offs (off = those still turn a held socket off).
              End one hold early from its row below (tap, then Cancel) or all with Clear all holds.
              [Help: Dump manual hold](https://github.com/Curt-Alfrey-s-Org/victron-ble2mqtt-integration/blob/main/docs/site-solar/dump-hold.md)
            grid_options:
              columns: full
          - type: entities
            title: Dump manual hold
            show_header_toggle: false
            state_color: true
            entities:
              - entity: input_number.dump_manual_hold_min
                name: Hold after a hand switch (0 = off)
              - entity: input_boolean.dump_hold_blocks_turn_off
                name: Hold also blocks turn-offs
              - type: button
                name: Clear all holds
                icon: mdi:hand-back-right-off
                action_name: CLEAR
                tap_action:
                  action: perform-action
                  perform_action: script.dump_clear_holds
          - type: custom:auto-entities
            card:
              type: entities
              title: Holds (per socket)
              show_header_toggle: false
              state_color: true
            filter:
              template: |-
                {%- macro sock_name(s) -%}{%- set b = ['', 'unknown', 'unavailable', 'none'] -%}{%- set p = s[:4] -%}{%- set tag = p | upper ~ ' ' ~ s[5:] -%}{%- set l = states('input_text.h5082_' ~ s ~ '_load') | trim -%}{%- set w = states('input_text.h5082_' ~ p ~ '_location') | trim -%}{{ (l ~ ' (' ~ tag ~ ')') if l not in b else tag }}{{ (' at ' ~ w) if w not in b else '' }}{%- endmacro -%}
                [
                {%- for s in [
                  '2f9d_left', '2f9d_right',
