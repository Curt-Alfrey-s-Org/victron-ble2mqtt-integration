      - type: vertical-stack
        title: Dump
        cards:
          - type: markdown
            title: Dump load
            content: >
              **Dump load HA control** is the kill switch for HA automations that turn
              the sim dump plugs on and off (Victron float + solar-present, re-bulk
              and solar-gone off, min on/off timers, staged plug add). **Off** =
              automations do nothing. **On** = they may add one plug, wait for that
              plug's live watt sensor, then add another only if float band, inverter
              headroom, and batteries still allow it. Physical loads on T2/KU show on those SmartShunts; SPH shows
              on INV OUTPUT plus cart battery amps. Plug watts come from the smart
              plug power entity (set on each row), not a typed rating. Never all six
              at once. Plug header toggle is manual only.
              Doc: [DUMP_LOAD_HA_CONTROL.md](https://github.com/Curt-Alfrey-s-Org/victron-ble2mqtt-integration/blob/main/docs/DUMP_LOAD_HA_CONTROL.md).
              Helpers list (backup): [Settings > Helpers](/config/helpers).
          - type: entities
            title: Dump load HA control
            show_header_toggle: false
            entities:
              - entity: input_boolean.dump_control_enabled
                name: Automations on/off
                icon: mdi:transmission-tower-export
                secondary_info: last-changed
              - entity: input_boolean.dump_soc_unsynced
                name: SoC unsynced (skip 95% gate)
              - entity: input_number.dump_float_t2_v
                name: T2 float V
              - entity: input_number.dump_rebulk_t2_v
                name: T2 re-bulk V
              - entity: input_number.dump_float_ku_v
                name: KU float V
              - entity: input_number.dump_rebulk_ku_v
                name: KU re-bulk V
              - entity: input_number.dump_float_sph_v
                name: SPH float V
              - entity: input_number.dump_rebulk_sph_v
                name: SPH re-bulk V
              - entity: input_number.dump_min_solar_w
                name: Min solar W (day vs night)
              - entity: input_number.dump_min_soc_percent
                name: Min SoC % (when synced)
              - entity: binary_sensor.dump_charge_float
                name: MPPT float
              - entity: binary_sensor.dump_solar_present
                name: Solar present
              - entity: binary_sensor.dump_soc_ok
                name: SoC ok
              - entity: binary_sensor.dump_v_float_t2
                name: T2 float hold
              - entity: binary_sensor.dump_v_rebulk_t2
                name: T2 re-bulk
              - entity: binary_sensor.dump_v_float_ku
                name: KU float hold
              - entity: binary_sensor.dump_v_rebulk_ku
                name: KU re-bulk
              - entity: binary_sensor.dump_v_float_sph
                name: SPH float hold
              - entity: binary_sensor.dump_v_rebulk_sph
                name: SPH re-bulk
              - entity: input_number.dump_ac_limit_t2_w
                name: T2 AC limit
              - entity: input_number.dump_ac_limit_ku_w
                name: KU AC limit
              - entity: input_number.dump_ac_limit_sph_w
                name: SPH AC limit
              - entity: input_number.dump_max_discharge_t2_w
                name: T2 max batt discharge
              - entity: input_number.dump_max_discharge_ku_w
                name: KU max batt discharge
              - entity: input_number.dump_max_discharge_sph_w
                name: SPH max batt discharge
              - entity: binary_sensor.dump_batt_t2_ok
                name: T2 batt ok
              - entity: binary_sensor.dump_batt_ku_ok
                name: KU batt ok
              - entity: binary_sensor.dump_batt_sph_ok
                name: SPH batt ok
              - entity: sensor.dump_next_plug
                name: Next plug that fits
              - entity: sensor.dump_surplus_w
                name: Dump surplus
              - type: weblink
                name: DUMP_LOAD_HA_CONTROL.md (what this does)
                url: https://github.com/Curt-Alfrey-s-Org/victron-ble2mqtt-integration/blob/main/docs/DUMP_LOAD_HA_CONTROL.md
                icon: mdi:file-document-outline
              - type: weblink
                name: Helpers (same switch if this card is missing)
                url: /config/helpers
                icon: mdi:tune
          - type: entities
            title: Sim dump plugs
            show_header_toggle: true
            entities:
              - entity: switch.sim_ac_plug_1
                name: Plug 1
              - entity: sensor.sim_ac_plug_1_power
                name: 1 live W
              - entity: input_text.dump_plug_1_power_entity
                name: 1 power sensor
              - entity: input_select.dump_plug_1_inverter
                name: 1 inverter
              - entity: switch.sim_ac_plug_2
                name: Plug 2
              - entity: sensor.sim_ac_plug_2_power
                name: 2 live W
              - entity: input_text.dump_plug_2_power_entity
                name: 2 power sensor
              - entity: input_select.dump_plug_2_inverter
                name: 2 inverter
              - entity: switch.sim_ac_plug_3
                name: Plug 3
              - entity: sensor.sim_ac_plug_3_power
                name: 3 live W
              - entity: input_text.dump_plug_3_power_entity
                name: 3 power sensor
              - entity: input_select.dump_plug_3_inverter
                name: 3 inverter
              - entity: switch.sim_ac_plug_4
                name: Plug 4
              - entity: sensor.sim_ac_plug_4_power
                name: 4 live W
              - entity: input_text.dump_plug_4_power_entity
                name: 4 power sensor
              - entity: input_select.dump_plug_4_inverter
                name: 4 inverter
              - entity: switch.sim_ac_plug_5
                name: Plug 5
              - entity: sensor.sim_ac_plug_5_power
                name: 5 live W
              - entity: input_text.dump_plug_5_power_entity
                name: 5 power sensor
              - entity: input_select.dump_plug_5_inverter
                name: 5 inverter
              - entity: switch.sim_ac_plug_6
                name: Plug 6
              - entity: sensor.sim_ac_plug_6_power
                name: 6 live W
              - entity: input_text.dump_plug_6_power_entity
                name: 6 power sensor
              - entity: input_select.dump_plug_6_inverter
                name: 6 inverter

      - type: vertical-stack
        title: House
        cards:
          - type: thermostat
            entity: climate.417373300314
            name: Ecobee
          - type: weather-forecast
            entity: weather.417373300314
            name: Ecobee outdoor
            forecast_type: daily
            show_current: true
            show_forecast: true
            secondary_info_attribute: humidity
          - type: weather-forecast
            entity: weather.417373300314
            name: Ecobee outdoor hourly
            forecast_type: hourly
            show_current: false
            show_forecast: true
          - type: markdown
            content: >
              **NWS Watauga Lake** (36.32 N, 82.12 W; Hampton / Carter County).
              Radar **KMRX**. Alerts: {{ states('sensor.nws_watauga_lake_alerts') }}.
              Loop below is the official [standard radar GIF](https://www.weather.gov/radarfaq/).
              Tap it for [KMRX standard radar](https://radar.weather.gov/station/KMRX/standard).
          - type: picture
            image: https://radar.weather.gov/ridge/standard/KMRX_loop.gif
            alt_text: NWS Morristown KMRX standard radar loop for Watauga Lake
            tap_action:
              action: url
              url_path: https://radar.weather.gov/station/KMRX/standard
          - type: glance
            title: Trailer hygrometer
            show_name: true
            show_icon: true
            show_state: true
            entities:
              - entity: sensor.thermo_hygrometer_caaf6f_h5072_75_tempc
                name: Temp
              - entity: sensor.thermo_hygrometer_caaf6f_h5072_75_hum
                name: Humidity
              - entity: sensor.thermo_hygrometer_caaf6f_h5072_75_batt
                name: Battery

