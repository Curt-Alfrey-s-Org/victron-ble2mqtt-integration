# Solar plant Lovelace (YAML). Official cards only.
# https://www.home-assistant.io/dashboards/dashboards/#adding-yaml-dashboards
# https://www.home-assistant.io/dashboards/energy/
title: Solar plant
views:
  - title: Now
    path: now
    cards:
      - type: markdown
        title: Solar plant
        content: >
          Live watts from Home Assistant (Victron MQTT, Refoss, Sungold).
          **power-sankey** fills after **Settings > Dashboards > Energy**
          ([energy cards](https://www.home-assistant.io/dashboards/energy/)).
          Dump ON/OFF is alfa-ai `solar_dump.py`. **Now** shows the six
          sim dump switches so ticks are visible; a header toggle is
          **manual** only.
          KU charger watts are **est.** (no live Victron KU clamps).
          Do not add A3 as utility grid.

      - type: power-sankey
        title: Power flow
        layout: horizontal
        collection_key: energy_dashboard
        group_by_area: false
        group_by_floor: false

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.solar_controller_solar
            name: T2 MPPT
            min: 0
            max: 400
            needle: true
          - type: gauge
            entity: sensor.battery_1_power
            name: Battery 1 T2
            min: -400
            max: 400
            needle: true
          - type: gauge
            entity: sensor.battery_2_power
            name: Battery 2 KU
            min: -400
            max: 400
            needle: true
          - type: gauge
            entity: sensor.ku_charger_equal_share_power
            name: KU share est.
            min: 0
            max: 400
            needle: true

      - type: glance
        title: T2 24 V
        show_name: true
        show_icon: true
        show_state: true
        columns: 4
        entities:
          - entity: sensor.solar_controller_solar
            name: MPPT W
          - entity: sensor.solar_controller_charge_state
            name: Charge
          - entity: sensor.battery_1_power
            name: Batt 1 W
          - entity: sensor.battery_1_voltage
            name: Batt 1 V
          - entity: sensor.battery_1_current
            name: Batt 1 A
          - entity: sensor.t2_ku_jumper_power
            name: Jumper est.

      - type: glance
        title: KU 24 V (est. chargers)
        show_name: true
        show_icon: true
        show_state: true
        columns: 4
        entities:
          - entity: sensor.ku_unmetered_pv_est_power
            name: KU PV est.
          - entity: sensor.ku_charger_equal_share_power
            name: Each charger est.
          - entity: sensor.battery_2_power
            name: Batt 2 W
          - entity: sensor.battery_2_voltage
            name: Batt 2 V
          - entity: sensor.battery_2_current
            name: Batt 2 A
          - entity: sensor.trailer_outlet_power
            name: LED+fan

      - type: markdown
        title: KU PV est.
        content: >
          **KU PV est.** may read **negative at night** — that signed residual is
          balance estimate / component losses, not live KU solar. Charger **est.**
          tiles split the lower bound by suitcase count only.

      - type: glance
        title: Loads (not losses)
        show_name: true
        show_icon: true
        show_state: true
        columns: 4
        entities:
          - entity: sensor.em16_a3_power
            name: A3 hot leg
          - entity: sensor.em16_b3_power
            name: B3 breaker
          - entity: sensor.sim_dump_load_power
            name: Sim dump
          - entity: sensor.sungold_sph302480a_load_power
            name: Pi4

      - type: markdown
        title: Sim dump plugs
        content: >
          These six [template switches](https://www.home-assistant.io/integrations/switch/)
          are the alfa-ai dump allowlist. ON/OFF here tracks `solar_dump.py`
          ([entities card](https://www.home-assistant.io/dashboards/entities/)).
          The header toggle is **manual**. Names that say fan are **lab dump
          loads**, not the trailer LED/fan or Pi4.

      - type: entities
        title: Sim dump plugs
        show_header_toggle: true
        entities:
          - entity: switch.sim_ac_plug_1
            name: 1 fan 180 W
          - entity: switch.sim_ac_plug_2
            name: 2 dehumidifier 300 W
          - entity: switch.sim_ac_plug_3
            name: 3 water heater 1200 W
          - entity: switch.sim_ac_plug_4
            name: 4 fan 130 W
          - entity: switch.sim_ac_plug_5
            name: 5 fan 130 W
          - entity: switch.sim_ac_plug_6
            name: 6 gaming PC 300 W

      - type: glance
        title: Sim dump plug W
        show_name: true
        show_icon: true
        show_state: true
        columns: 4
        entities:
          - entity: sensor.sim_dump_load_power
            name: Total
          - entity: sensor.sim_ac_plug_1_power
            name: 1
          - entity: sensor.sim_ac_plug_2_power
            name: 2
          - entity: sensor.sim_ac_plug_3_power
            name: 3
          - entity: sensor.sim_ac_plug_4_power
            name: 4
          - entity: sensor.sim_ac_plug_5_power
            name: 5
          - entity: sensor.sim_ac_plug_6_power
            name: 6

      - type: glance
        title: Conversion losses
        show_name: true
        show_icon: true
        show_state: true
        columns: 3
        entities:
          - entity: sensor.solar_component_losses_power
            name: Total est.
          - entity: sensor.t2_mppt_conversion_loss_power
            name: T2 MPPT
          - entity: sensor.sungold_conversion_loss_power
            name: Sungold

      - type: gauge
        entity: sensor.solar_component_losses_power
        name: Component losses
        min: 0
        max: 200
        needle: true

      - type: glance
        title: Sungold cart
        show_name: true
        show_icon: true
        show_state: true
        columns: 4
        entities:
          - entity: sensor.sungold_sph302480a_pv_power
            name: PV W
          - entity: sensor.sungold_sph302480a_pv_voltage
            name: PV V
          - entity: sensor.sungold_sph302480a_pv_current
            name: PV A
          - entity: sensor.sungold_sph302480a_charging_power
            name: Cart batt
          - entity: sensor.sungold_sph302480a_battery_voltage
            name: Batt V
          - entity: sensor.sungold_sph302480a_battery_current
            name: Batt A
          - entity: sensor.sungold_sph302480a_battery_soc
            name: Batt SoC
          - entity: sensor.sungold_sph302480a_battery_temperature
            name: Batt temp
          - entity: sensor.sungold_sph302480a_load_power
            name: Load W
          - entity: sensor.sungold_sph302480a_grid_voltage
            name: UTI V
          - entity: sensor.sungold_sph302480a_inverter_state
            name: Mode

      - type: glance
        title: Sungold status
        show_name: true
        show_icon: true
        show_state: true
        columns: 4
        entities:
          - entity: sensor.sungold_sph302480a_charge_state
            name: Charge
          - entity: sensor.sungold_sph302480a_ac_output_voltage
            name: AC out V
          - entity: sensor.sungold_sph302480a_ac_output_frequency
            name: AC out Hz
          - entity: sensor.sungold_sph302480a_load_current
            name: Load A
          - entity: sensor.sungold_sph302480a_grid_current
            name: AC in A
          - entity: sensor.sungold_sph302480a_grid_frequency
            name: AC in Hz
          - entity: sensor.sungold_sph302480a_fail_code
            name: Fault
          - entity: binary_sensor.sungold_sph302480a_fault_active
            name: Fault LED
          - entity: sensor.sungold_sph302480a_inverter_error_flags
            name: Error flags

      - type: glance
        title: T2 MPPT extras
        show_name: true
        show_icon: true
        show_state: true
        columns: 4
        entities:
          - entity: sensor.solar_controller_yield_today
            name: Yield today
          - entity: sensor.solar_controller_charging_power
            name: Charge W
          - entity: sensor.solar_controller_load_power
            name: Load W
          - entity: sensor.solar_controller_load
            name: Load
          - entity: sensor.solar_controller_rssi
            name: RSSI

      - type: glance
        title: T2 shunt extras
        show_name: true
        show_icon: true
        show_state: true
        columns: 4
        entities:
          - entity: sensor.battery_1_state_of_charge
            name: SoC
          - entity: sensor.battery_1_consumed_ah
            name: Consumed Ah
          - entity: sensor.battery_1_remaining_minutes
            name: Remaining min
          - entity: sensor.battery_1_rssi
            name: RSSI

      - type: glance
        title: KU shunt extras
        show_name: true
        show_icon: true
        show_state: true
        columns: 4
        entities:
          - entity: sensor.battery_2_state_of_charge
            name: SoC
          - entity: sensor.battery_2_consumed_ah
            name: Consumed Ah
          - entity: sensor.battery_2_remaining_minutes
            name: Remaining min
          - entity: sensor.battery_2_rssi
            name: RSSI

      - type: thermostat
        entity: climate.417373300314
        name: Ecobee

      - type: glance
        title: Ecobee
        show_name: true
        show_icon: true
        show_state: true
        columns: 2
        entities:
          - entity: sensor.417373300314_temperature
            name: Temp
          - entity: sensor.417373300314_humidity
            name: Humidity

      - type: glance
        title: Trailer hygrometer
        show_name: true
        show_icon: true
        show_state: true
        columns: 3
        entities:
          - entity: sensor.thermo_hygrometer_caaf6f_h5072_75_tempc
            name: Temp
          - entity: sensor.thermo_hygrometer_caaf6f_h5072_75_hum
            name: Humidity
          - entity: sensor.thermo_hygrometer_caaf6f_h5072_75_batt
            name: Battery

      - type: distribution
        title: Instant W
        entities:
          - entity: sensor.solar_controller_solar
            name: T2 MPPT
          - entity: sensor.trailer_outlet_power
            name: LED+fan
          - entity: sensor.sim_dump_load_power
            name: Sim dump
          - entity: sensor.sungold_sph302480a_load_power
            name: Pi4
          - entity: sensor.sungold_sph302480a_pv_power
            name: Sungold PV

  - title: History
    path: history
    cards:
      - type: markdown
        content: >
          History graph needs [Recorder](https://www.home-assistant.io/integrations/recorder/)
          and [History](https://www.home-assistant.io/integrations/history/).

      - type: history-graph
        title: Watts
        hours_to_show: 72
        entities:
          - entity: sensor.solar_controller_solar
            name: T2 MPPT
          - entity: sensor.battery_1_power
            name: Battery 1
          - entity: sensor.battery_2_power
            name: Battery 2
          - entity: sensor.t2_ku_jumper_power
            name: Jumper est.
          - entity: sensor.trailer_outlet_power
            name: Trailer outlet
          - entity: sensor.sim_dump_load_power
            name: Sim dump
          - entity: sensor.sungold_sph302480a_load_power
            name: Sungold load
          - entity: sensor.sungold_sph302480a_pv_power
            name: Sungold PV

      - type: history-graph
        title: Watts (chargers)
        hours_to_show: 72
        entities:
          - entity: sensor.ku_unmetered_pv_est_power
            name: KU PV est.
          - entity: sensor.ku_charger_equal_share_power
            name: KU share est.
          - entity: sensor.solar_controller_charging_power
            name: T2 charge
          - entity: sensor.sungold_sph302480a_charging_power
            name: Sungold charge

      - type: history-graph
        title: Watts (losses)
        hours_to_show: 72
        entities:
          - entity: sensor.solar_component_losses_power
            name: Total est.
          - entity: sensor.t2_mppt_conversion_loss_power
            name: T2 MPPT
          - entity: sensor.sungold_conversion_loss_power
            name: Sungold

      - type: history-graph
        title: Sim dump plugs
        hours_to_show: 72
        entities:
          - entity: switch.sim_ac_plug_1
            name: 1 fan
          - entity: switch.sim_ac_plug_2
            name: 2 dehumidifier
          - entity: switch.sim_ac_plug_3
            name: 3 water heater
          - entity: switch.sim_ac_plug_4
            name: 4 fan
          - entity: switch.sim_ac_plug_5
            name: 5 fan
          - entity: switch.sim_ac_plug_6
            name: 6 gaming PC

      - type: history-graph
        title: Sim dump plug W
        hours_to_show: 72
        entities:
          - entity: sensor.sim_dump_load_power
            name: Total
          - entity: sensor.sim_ac_plug_1_power
            name: 1
          - entity: sensor.sim_ac_plug_2_power
            name: 2
          - entity: sensor.sim_ac_plug_3_power
            name: 3
          - entity: sensor.sim_ac_plug_4_power
            name: 4
          - entity: sensor.sim_ac_plug_5_power
            name: 5
          - entity: sensor.sim_ac_plug_6_power
            name: 6

      - type: history-graph
        title: Hz
        hours_to_show: 72
        entities:
          - entity: sensor.sungold_sph302480a_grid_frequency
            name: AC in
          - entity: sensor.sungold_sph302480a_ac_output_frequency
            name: AC out

      - type: history-graph
        title: Volts
        hours_to_show: 72
        entities:
          - entity: sensor.battery_1_voltage
            name: Battery 1
          - entity: sensor.battery_2_voltage
            name: Battery 2
          - entity: sensor.solar_controller_battery
            name: T2 batt
          - entity: sensor.sungold_sph302480a_battery_voltage
            name: Sungold batt
          - entity: sensor.sungold_sph302480a_pv_voltage
            name: Sungold PV
          - entity: sensor.sungold_sph302480a_grid_voltage
            name: Sungold grid
          - entity: sensor.sungold_sph302480a_ac_output_voltage
            name: Sungold AC out

      - type: history-graph
        title: Amps
        hours_to_show: 72
        entities:
          - entity: sensor.battery_1_current
            name: Battery 1
          - entity: sensor.battery_2_current
            name: Battery 2
          - entity: sensor.solar_controller_battery_charging
            name: T2 charge
          - entity: sensor.sungold_sph302480a_battery_current
            name: Sungold batt
          - entity: sensor.sungold_sph302480a_pv_current
            name: Sungold PV
          - entity: sensor.sungold_sph302480a_load_current
            name: Sungold load
          - entity: sensor.sungold_sph302480a_grid_current
            name: Sungold grid

      - type: history-graph
        title: SoC / %
        hours_to_show: 72
        entities:
          - entity: sensor.battery_1_state_of_charge
            name: Battery 1 SoC
          - entity: sensor.battery_2_state_of_charge
            name: Battery 2 SoC
          - entity: sensor.sungold_sph302480a_battery_soc
            name: Sungold SoC
          - entity: sensor.417373300314_humidity
            name: Ecobee humidity
          - entity: sensor.thermo_hygrometer_caaf6f_h5072_75_hum
            name: Hygrometer hum
          - entity: sensor.thermo_hygrometer_caaf6f_h5072_75_batt
            name: Hygrometer batt

      - type: history-graph
        title: Temperature
        hours_to_show: 72
        entities:
          - entity: sensor.417373300314_temperature
            name: Ecobee temp
          - entity: sensor.thermo_hygrometer_caaf6f_h5072_75_tempc
            name: Hygrometer temp
          - entity: sensor.sungold_sph302480a_battery_temperature
            name: Sungold batt
          - entity: sensor.sungold_sph302480a_temperature_dc_dc
            name: Sungold DC-DC
          - entity: sensor.sungold_sph302480a_temperature_dc_ac
            name: Sungold DC-AC

      - type: statistics-graph
        title: kWh
        chart_type: line
        days_to_show: 7
        period: hour
        entities:
          - entity: sensor.t2_mppt_energy_kwh
            name: T2 MPPT
          - entity: sensor.battery_1_charge_energy_kwh
            name: Batt 1 charge
          - entity: sensor.battery_1_discharge_energy_kwh
            name: Batt 1 discharge
          - entity: sensor.battery_2_charge_energy_kwh
            name: Batt 2 charge
          - entity: sensor.battery_2_discharge_energy_kwh
            name: Batt 2 discharge
          - entity: sensor.em16_a3_energy_kwh
            name: Trailer A3
          - entity: sensor.sungold_load_energy_kwh
            name: Sungold load
          - entity: sensor.sim_dump_energy_kwh
            name: Sim dump
