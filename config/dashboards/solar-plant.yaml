      - type: grid
        cards:
          - type: heading
            heading: Socket Use (normal / dump)
            icon: mdi:toggle-switch
          - type: markdown
            content: |
              Decides which sockets HA may switch by itself: **dump** = the dump rules may turn it on and off, **normal** = HA never touches it (you still can). A socket whose Inverter is **House** (grid power) is never switched by dump control, even set to dump.
              Only choose dump for a socket whose load may lose power at any time; each row shows the live Load and Where you typed (or the plug id and side when blank).
              Safe start: everything normal, then one dump socket with a lamp to test.
              [Help: Socket Use (normal / dump)](https://github.com/Curt-Alfrey-s-Org/victron-ble2mqtt-integration/blob/main/docs/site-solar/socket-use.md)
            grid_options:
              columns: full
          - type: custom:auto-entities
            card:
              type: entities
              title: Socket Use
              show_header_toggle: false
              state_color: true
            filter:
              template: |-
                {%- macro sock_name(s) -%}{%- set b = ['', 'unknown', 'unavailable', 'none'] -%}{%- set p = s[:4] -%}{%- set tag = p | upper ~ ' ' ~ s[5:] -%}{%- set l = states('input_text.h5082_' ~ s ~ '_load') | trim -%}{%- set w = states('input_text.h5082_' ~ p ~ '_location') | trim -%}{{ (l ~ ' (' ~ tag ~ ')') if l not in b else tag }}{{ (' at ' ~ w) if w not in b else '' }}{%- endmacro -%}
                [
                {%- for e in [
                  'input_select.h5082_2f9d_left_use', 'input_select.h5082_2f9d_right_use',
                  'input_select.h5082_3013_left_use', 'input_select.h5082_3013_right_use',
                  'input_select.h5082_3ec9_left_use', 'input_select.h5082_3ec9_right_use',
                  'input_select.h5082_82fb_left_use', 'input_select.h5082_82fb_right_use',
                  'input_select.h5082_9607_left_use', 'input_select.h5082_9607_right_use',
                  'input_select.h5082_c061_left_use', 'input_select.h5082_c061_right_use',
                  'input_select.h5082_c38d_left_use', 'input_select.h5082_c38d_right_use',
                  'input_select.h5082_cf79_left_use', 'input_select.h5082_cf79_right_use',
                ] -%}
                {%- set s = e.split('.')[1][6:].rsplit('_', 1)[0] -%}
                {{ {'entity': e, 'name': sock_name(s)} | tojson }}{{ ',' if not loop.last else '' }}
                {%- endfor -%}
                ]
            show_empty: true
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Socket inverter (bus)
            icon: mdi:car-battery
          - type: markdown
            content: |
              Which inverter / battery bus feeds each socket (T2, KU or Sungold): HA uses that bus's volts, battery and AC limit to decide on/off, and its meter to confirm the load. **House** = plug on house grid power: dump control never switches it (even set to dump); you still can.
              A wrong choice makes HA watch the wrong battery, so set it to where the socket is really wired.
              It only matters for sockets whose Use is dump; a brand-new socket starts on Sungold.
              [Help: Socket inverter (bus)](https://github.com/Curt-Alfrey-s-Org/victron-ble2mqtt-integration/blob/main/docs/site-solar/socket-inverter.md)
            grid_options:
              columns: full
          - type: custom:auto-entities
            card:
              type: entities
              title: Socket inverter
              show_header_toggle: false
              state_color: true
            filter:
