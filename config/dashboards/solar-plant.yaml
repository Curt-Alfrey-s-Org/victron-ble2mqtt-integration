# Solar plant Lovelace (YAML). Official cards only.
# https://www.home-assistant.io/dashboards/dashboards/#adding-yaml-dashboards
# https://www.home-assistant.io/dashboards/sections/
title: Solar plant
views:
  - title: Now
    path: now
    type: sections
    max_columns: 3
    dense_section_placement: false
    header:
      layout: responsive
      badges_position: bottom
      card:
        type: markdown
        title: Solar plant
        content: >
          **power-sankey** fills after **Settings > Dashboards > Energy**
          ([energy cards](https://www.home-assistant.io/dashboards/energy/)).
          Dump kill switch: **Dump** Automations tile (`sim_dump_control.yaml`).
          Staging confirms **SPH AC-out** (or T2/KU pack sign) after 5 s, then 15 min
          on / 10 min cooldown. Not per-plug Govee watts.
          **Sungold AC out** = INV OUTPUT (Pi4 + dump); **Sungold AC-in** = trailer
          outlet clamp. Not cargo LED/vent tiles.
          **KU PV est.** may be negative at night (balance residual). Do not add A3
          as utility grid. **Jumper** is shunt-to-shunt (already in Batt 1 and Batt 2);
          do not add it to Solar / Charge / Load.
    badges:
      - type: entity
        entity: sensor.battery_1_state_of_charge
        name: T2 SoC
        show_name: true
      - type: entity
        entity: sensor.battery_2_state_of_charge
        name: KU SoC
        show_name: true
      - type: entity
        entity: sensor.sungold_sph302480a_battery_soc
        name: SPH SoC
        show_name: true
      - type: entity
        entity: sensor.nws_watauga_lake_alerts
        name: NWS
        show_name: true
      - type: entity
        entity: input_boolean.dump_control_enabled
        name: Dump
        show_name: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Site totals
          - type: markdown
            content: >
              **Solar** = T2 clamp + Sungold PV + max(0, KU residual).
              KU residual subtracts jumper so T2 watts already in Batt 2 are not KU PV.
              **Charge** = T2+KU+SPH packs (not T2 MPPT output; jumper already in Batt 1/2).
              **Load** = Sungold AC out (same entity; do not add dump, AC-in, or jumper).
              **KU share** = KU PV est / 3. **Jumper** = shunt-to-shunt leftover (not extra watts).
              **Sungold AC-in** = trailer clamp. **UTI V×A** is SPH grid P=VI.
              **Today** = daily utility meter on each kWh integral (not the lifetime
              total on `*_energy_kwh`). Solar, charge, and load today do not add up:
              load is SPH AC-out only; charge is pack inflow; KU Renogy and losses
              are elsewhere.
            grid_options:
              columns: full
          - type: tile
            entity: sensor.site_solar_power
            name: Solar now
          - type: tile
            entity: sensor.site_solar_today
            name: Solar today
          - type: tile
            entity: sensor.site_charge_power
            name: Charge now
          - type: tile
            entity: sensor.site_charge_today
            name: Charge today
          - type: tile
            entity: sensor.sungold_sph302480a_load_power
            name: Load now
          - type: tile
            entity: sensor.sungold_load_today
            name: Load today

      - type: grid
        cards:
          - type: heading
            heading: Power flow
          - type: power-sankey
            title: Power flow
            layout: auto
            collection_key: energy_dashboard
            group_by_area: false
            group_by_floor: false
            grid_options:
              columns: full
          - type: distribution
            title: Instant W
            entities:
              - entity: sensor.solar_controller_solar
                name: T2 MPPT
              - entity: sensor.sungold_sph302480a_load_power
                name: Sungold AC out
              - entity: sensor.sungold_sph302480a_pv_power
                name: Sungold PV
              - entity: sensor.sim_dump_load_power
                name: Sim dump
            grid_options:
              columns: full

      - type: grid
