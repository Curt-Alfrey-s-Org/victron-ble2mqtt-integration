              When and why a plug was switched and when the dump rules ran; lines starting **Dump control** give the reason in plain words (volts, watts, rule name).
              "Triggered by ... automation Dump ..." means HA did it; a person's name means it was done by hand.
              Nothing to set.
              [Help: Dump activity log](https://github.com/Curt-Alfrey-s-Org/victron-ble2mqtt-integration/blob/main/docs/site-solar/dump-activity-log.md)
