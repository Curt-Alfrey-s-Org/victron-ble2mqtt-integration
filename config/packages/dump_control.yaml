# Dump-load CONTROL (HA owns on/off). Opt-in package for Home Assistant on .105.
# Drives the real Govee H5082 sockets (switch.ihoment_h5082_<id>_<side>, MQTT from
# govee_h5082 on the Pi 4). A socket is a dump socket only while its
# input_select.h5082_<id>_<side>_use is "dump" (helpers from
# scripts/create_h5082_socket_labels.py, default "normal") AND its
# input_select.h5082_<id>_<side>_inverter is not "House". A "normal" socket and a
# "House" socket (plug on house grid power) are never turned on or off by these
# automations: every socket pick below uses that same two-part test (the guard).
# Use "Sungold charge" is not a dump. Those sockets are skipped by every dump
# add, shed, off, on-demand pick and by the voltage-guard shed. The Sungold
# charge rules (below) are the only ones that switch them. See
# docs/site-solar/sph-charge.md.
# See docs/DUMP_LOAD_HA_CONTROL.md.
# All 8 plugs / 16 sockets are in the socket lists (C38D was paired 2026-09-28 and
# added after 2F9D ... C061, before CF79). What is plugged into each socket and where
# each plug sits are NOT written here: they are the input_text Where / Load helpers
# you set in HA (Site solar > Plug names), and the logbook lines read them live.
# Stage/shed order is the list order below (stage first, shed last-first).
# Manual hold (2026-09-28): a dump socket switched by hand (Plugs button, the plug's own
# button, Turn next dump ON / Turn dumps OFF, any change dump control did not request)
# starts timer.h5082_<id>_<side>_hold for input_number.dump_manual_hold_min (0 = off).
# While a hold is active dump control never turns that socket ON, and turns it OFF only
# if input_boolean.dump_hold_blocks_turn_off is off. Dump rules announce each switch
# with the event dump_control_switching (sensor.dump_control_switching) so hand switches
# can be told apart. The on-demand scripts do NOT fire that event: the resulting plug
# report is a hand switch, so the hold arms only after the plug actually changes.
# See docs/site-solar/dump-hold.md and docs/site-solar/dump-on-demand.md.
# Skip cooldown once (input_boolean.dump_skip_cooldown): while on, the next automatic
# add and Turn next dump ON ignore per-socket cooldown. The switch turns itself off
# after that next on, or after Turn dumps OFF (those offs do not start a cooldown).
# Sungold voltage guard: binary_sensor.dump_sph_vguard. While on, no new dump socket
# whose Inverter is Sungold is added, and (master switch on, after the dwell helper)
# those dump sockets are turned off. Thresholds are helpers with no initial. The
# Sungold sidecar is read-only, so this cannot change inverter charge settings.
# See docs/site-solar/dump-sph-vguard.md.
# Sungold charge: Use "Sungold charge" plus input_boolean.sph_charge_enabled.
# Turns that socket on when the Sungold pack is low and the bank named by its
# Inverter helper (T2 or KU) is healthy, and off when the pack recovers or that
# bank falls under the source-stop helper. A guard trip is also a charge reason
# while both switches are on. The inverter's own panel must allow mains charging.
# Victron float hold then staged ON (site load delta, 15 min min-on, 10 min cooldown).
# Solar-gone and re-bulk OFF (1 minute). Shed one dump plug when Sungold load > site solar.
# Notify when that overdraw lasts 10 minutes (Companion or persistent).
# Surplus watts (dump_surplus_w) are briefing only -- not the ON trigger.
# Every switch action also writes a plain reason to the logbook ("Dump control ..."),
# shown on Site solar > Dump activity log. Helpers have no `initial:` (see below).
# Official:
#   https://www.home-assistant.io/docs/configuration/packages/
#   https://www.home-assistant.io/docs/automation/yaml/
#   https://www.home-assistant.io/integrations/threshold/
#   https://www.home-assistant.io/docs/automation/trigger/
#   https://www.home-assistant.io/integrations/timer/
#   https://www.home-assistant.io/integrations/derivative/
#   https://www.home-assistant.io/integrations/template/
#   https://www.home-assistant.io/integrations/switch/
#   https://www.home-assistant.io/integrations/input_number/
#   https://www.home-assistant.io/integrations/input_select/
#   https://www.home-assistant.io/integrations/input_text/
#   https://www.home-assistant.io/integrations/notify/
#   https://www.home-assistant.io/docs/scripts/
#   https://www.home-assistant.io/docs/automation/trigger/#template-trigger
#   https://www.home-assistant.io/triggers/homeassistant/
#   https://www.home-assistant.io/triggers/event/
#   https://www.home-assistant.io/docs/configuration/events/
# Victron 1-minute re-bulk:
#   https://www.victronenergy.com/media/pg/Manual_BlueSolar_MPPT_75-10_up_to_100-20/en/operation.html
# SmartShunt +charge / -discharge:
#   https://www.victronenergy.com/media/pg/SmartShunt/en/operation.html

# Settings persistence (2026-09-28): NO helper in this package has `initial:`.
# With `initial:` Home Assistant puts the YAML value back at every restart and throws
# away the value you set in the UI (input_* async_added_to_hass only restores the last
# state when initial is unset; https://www.home-assistant.io/integrations/input_number/).
# Without it HA restores the last value from .storage/core.restore_state.
# Recommended starting values live in docs/site-solar/*.md and in
# script.dump_load_recommended_defaults (manual button, never automatic).
# A brand-new install starts numbers at their minimum and the kill switch OFF:
# press the defaults button once, check the values, then enable dump control.

# Load the logbook integration: every dump rule writes its reason with logbook.log and
# Site solar shows it in the Dump activity log. This HA has no default_config, and a
# missing logbook.log action would stop a rule mid-way. An empty key merges with any
# logbook: already in configuration.yaml. https://www.home-assistant.io/integrations/logbook/
logbook:

input_boolean:
  dump_control_enabled:
    name: Dump load HA control (master switch)
    icon: mdi:transmission-tower-export
  dump_soc_unsynced:
    name: Dump ignore SoC (shunt not synced)
    icon: mdi:battery-unknown
  # Manual hold: on = a held socket is also skipped by every dump turn-off rule
  # (solar gone, stop volts, battery limit, sheds); off = those rules still turn a held
  # socket off. Only turn-ON always respects a hold. See docs/site-solar/dump-hold.md.
  dump_hold_blocks_turn_off:
    name: Dump hold also blocks turn-offs
    icon: mdi:hand-back-right-off-outline
  dump_skip_cooldown:
    name: Dump skip cooldown once
    icon: mdi:timer-off-outline
  dump_sph_vguard_enabled:
    name: Dump Sungold voltage guard
    icon: mdi:battery-heart-outline
  # Sungold charge (grid inlet). Own switch: does not follow the dump master switch.
  # A brand-new boolean starts off. Suggested starts are in docs/site-solar/sph-charge.md.
  sph_charge_enabled:
    name: Sungold charge from T2 or KU
    icon: mdi:battery-charging
  sph_charge_soc_enabled:
    name: Sungold charge also when SoC is low
    icon: mdi:battery-low
  sph_charge_source_soc_enabled:
    name: Sungold charge require source SoC
    icon: mdi:battery-high

