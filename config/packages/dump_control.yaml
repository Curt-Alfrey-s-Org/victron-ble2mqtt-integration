                 and not is_state('switch.ihoment_h5082_' ~ s, 'off') %}
                {% set ns.out = ns.out + [s] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
          msg: >-
            Sungold battery {{ states('sensor.sungold_sph302480a_battery_voltage') }} V,
            T2 {{ states('sensor.battery_1_voltage') }} V, KU {{ states('sensor.battery_2_voltage') }} V
            ({{ state_attr('binary_sensor.dump_sph_vguard', 'reason') }}).
            Floor {{ states('input_number.dump_sph_vguard_floor_v') }} V, margin
            {{ states('input_number.dump_sph_vguard_margin_v') }} V, hysteresis
            {{ states('input_number.dump_sph_vguard_hysteresis_v') }} V, dwell
            {{ states('input_number.dump_sph_vguard_dwell_s') }} s.
          svc: "{{ states('input_text.dump_notify_service') | trim }}"
      - action: notify.persistent_notification
        data:
          title: Sungold voltage guard
          message: "{{ msg }}"
      - if:
          - condition: template
            value_template: "{{ svc not in ['persistent_notification', '', 'unknown', 'unavailable', 'none'] }}"
        then:
          - action: "notify.{{ svc }}"
            data:
              title: Sungold voltage guard
              message: "{{ msg }}"
      - if:
          - condition: state
            entity_id: input_boolean.dump_control_enabled
            state: "on"
        then:
          - repeat:
              for_each: "{{ targets }}"
              sequence:
                - event: dump_control_switching
                  event_data:
                    sock: "{{ repeat.item }}"
                    state: "off"
                - action: switch.turn_off
                  target:
                    entity_id: "switch.ihoment_h5082_{{ repeat.item }}"
                - action: timer.cancel
                  target:
                    entity_id: "timer.h5082_{{ repeat.item }}_min_on"
                - action: timer.start
                  target:
                    entity_id: "timer.h5082_{{ repeat.item }}_cooldown"
                - variables:
                    sock: "{{ repeat.item }}"
                - *socket_label
                - action: logbook.log
                  data:
                    name: Dump control
                    entity_id: "switch.ihoment_h5082_{{ repeat.item }}"
                    message: >-
                      {{ label }}: turned OFF by "Dump OFF Sungold sockets: Sungold voltage guard": Sungold {{ states('sensor.sungold_sph302480a_battery_voltage') }} V, T2 {{ states('sensor.battery_1_voltage') }} V, KU {{ states('sensor.battery_2_voltage') }} V ({{ state_attr('binary_sensor.dump_sph_vguard', 'reason') }}). Cooldown 10 min.

  - id: dump_sph_charge_on
    alias: "Dump ON Sungold charge sockets: pack is low"
    description: >
      Sungold charge is enabled and the pack has stayed low for the dwell helper,
      under the floor, under the lower of the live T2 and KU volts by the margin,
      under the optional SoC, or because the Sungold voltage guard is on. Turns on
      each socket whose Use is Sungold charge and whose Inverter helper is T2 or KU
      when that bank is at the source minimum, the socket is off, not on hold and
      not in cooldown. Fires dump_control_switching first so a hand tap is still a
      hold. Does not use the dump master switch and does not switch dump sockets.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.sph_charge_need
        to: "on"
        for:
          seconds: "{{ states('input_number.sph_charge_dwell_s') | int(0) }}"
      - trigger: state
        entity_id:
          - sensor.battery_1_voltage
          - sensor.battery_2_voltage
          - sensor.battery_1_state_of_charge
          - sensor.battery_2_state_of_charge
      - trigger: state
        entity_id: input_boolean.sph_charge_enabled
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.sph_charge_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.sph_charge_need
        state: "on"
        for:
          seconds: "{{ states('input_number.sph_charge_dwell_s') | int(0) }}"
    actions:
      - variables:
          targets: >
            {% set ns = namespace(out=[]) %}
            {% for s in [
              '2f9d_left', '2f9d_right', '3013_left', '3013_right', '3ec9_left', '3ec9_right',
              '82fb_left', '82fb_right', '9607_left', '9607_right', 'c061_left', 'c061_right',
              'c38d_left', 'c38d_right', 'cf79_left', 'cf79_right'
            ] %}
              {% set bus = states('input_select.h5082_' ~ s ~ '_inverter') %}
              {% set rawv = states('sensor.battery_1_voltage') if bus == 'T2' else (states('sensor.battery_2_voltage') if bus == 'KU' else 'none') %}
              {% set rawsoc = states('sensor.battery_1_state_of_charge') if bus == 'T2' else (states('sensor.battery_2_state_of_charge') if bus == 'KU' else 'none') %}
              {% set vmin = states('input_number.sph_charge_source_min_v') %}
              {% set healthy = is_number(rawv) and is_number(vmin) and (rawv | float) >= (vmin | float) %}
              {% if is_state('input_boolean.sph_charge_source_soc_enabled', 'on') %}
                {% set sm = states('input_number.sph_charge_source_min_soc') %}
                {% set healthy = healthy and is_number(rawsoc) and is_number(sm) and (rawsoc | float) >= (sm | float) %}
              {% endif %}
              {% if is_state('input_select.h5082_' ~ s ~ '_use', 'Sungold charge')
                 and (bus == 'T2' or bus == 'KU')
                 and is_state('switch.ihoment_h5082_' ~ s, 'off')
                 and states('timer.h5082_' ~ s ~ '_hold') not in ['active', 'paused']
                 and is_state('timer.h5082_' ~ s ~ '_cooldown', 'idle')
                 and healthy %}
                {% set ns.out = ns.out + [s] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ is_state('switch.ihoment_h5082_' ~ repeat.item, 'off') and states('timer.h5082_' ~ repeat.item ~ '_hold') not in ['active', 'paused'] and is_state('timer.h5082_' ~ repeat.item ~ '_cooldown', 'idle') }}"
              then:
                - event: dump_control_switching
                  event_data:
                    sock: "{{ repeat.item }}"
                    state: "on"
                - action: switch.turn_on
                  target:
                    entity_id: "switch.ihoment_h5082_{{ repeat.item }}"
                - action: timer.start
                  target:
                    entity_id: "timer.h5082_{{ repeat.item }}_min_on"
                  data:
                    duration: >-
                      {% set n = states('input_number.sph_charge_min_on_s') | int(60) %}
                      {{ '%02d:%02d:%02d' % (n // 3600, (n % 3600) // 60, n % 60) }}
                - variables:
                    sock: "{{ repeat.item }}"
                - *socket_label
                - action: logbook.log
                  data:
                    name: Dump control
                    entity_id: "switch.ihoment_h5082_{{ repeat.item }}"
                    message: >-
                      {{ label }}: turned ON by "Dump ON Sungold charge sockets: pack is low": Sungold {{ states('sensor.sungold_sph302480a_battery_voltage') }} V, T2 {{ states('sensor.battery_1_voltage') }} V, KU {{ states('sensor.battery_2_voltage') }} V.

  - id: dump_sph_charge_off
    alias: "Dump OFF Sungold charge sockets: pack recovered"
    description: >
      Sungold charge is enabled and the pack has recovered for the dwell helper
      (at the full volts, or within the target gap of the lower T2 and KU shunt,
      and the voltage guard is off). Turns off Sungold charge sockets whose Inverter
      is T2 or KU after each socket's minimum on time, then starts that socket's
      cooldown. A held socket is skipped only while hold also blocks turn-offs.
      Does not wait out the minimum on time when the feeding bank is under stop volts;
      that is the source-stop rule. Does not switch dump sockets.
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.sph_charge_need
        to: "off"
        for:
          seconds: "{{ states('input_number.sph_charge_dwell_s') | int(0) }}"
      - trigger: state
        entity_id:
          - timer.h5082_2f9d_left_min_on
          - timer.h5082_2f9d_right_min_on
          - timer.h5082_3013_left_min_on
          - timer.h5082_3013_right_min_on
          - timer.h5082_3ec9_left_min_on
          - timer.h5082_3ec9_right_min_on
          - timer.h5082_82fb_left_min_on
          - timer.h5082_82fb_right_min_on
          - timer.h5082_9607_left_min_on
          - timer.h5082_9607_right_min_on
          - timer.h5082_c061_left_min_on
          - timer.h5082_c061_right_min_on
          - timer.h5082_c38d_left_min_on
          - timer.h5082_c38d_right_min_on
          - timer.h5082_cf79_left_min_on
          - timer.h5082_cf79_right_min_on
        to: "idle"
    conditions:
      - condition: state
        entity_id: input_boolean.sph_charge_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.sph_charge_need
        state: "off"
        for:
          seconds: "{{ states('input_number.sph_charge_dwell_s') | int(0) }}"
    actions:
      - variables:
          targets: >
            {% set ns = namespace(out=[]) %}
            {% for s in [
              '2f9d_left', '2f9d_right', '3013_left', '3013_right', '3ec9_left', '3ec9_right',
              '82fb_left', '82fb_right', '9607_left', '9607_right', 'c061_left', 'c061_right',
              'c38d_left', 'c38d_right', 'cf79_left', 'cf79_right'
            ] %}
              {% set bus = states('input_select.h5082_' ~ s ~ '_inverter') %}
              {% if is_state('input_select.h5082_' ~ s ~ '_use', 'Sungold charge')
                 and (bus == 'T2' or bus == 'KU')
                 and is_state('switch.ihoment_h5082_' ~ s, 'on')
                 and (states('timer.h5082_' ~ s ~ '_hold') not in ['active', 'paused'] or not is_state('input_boolean.dump_hold_blocks_turn_off', 'on')) %}
                {% set ns.out = ns.out + [s] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ states('timer.h5082_' ~ repeat.item ~ '_min_on') not in ['active', 'paused'] and is_state('switch.ihoment_h5082_' ~ repeat.item, 'on') }}"
              then:
                - event: dump_control_switching
                  event_data:
                    sock: "{{ repeat.item }}"
                    state: "off"
                - action: switch.turn_off
                  target:
                    entity_id: "switch.ihoment_h5082_{{ repeat.item }}"
                - action: timer.cancel
                  target:
                    entity_id: "timer.h5082_{{ repeat.item }}_min_on"
                - action: timer.start
                  target:
                    entity_id: "timer.h5082_{{ repeat.item }}_cooldown"
                - variables:
                    sock: "{{ repeat.item }}"
                - *socket_label
                - action: logbook.log
                  data:
                    name: Dump control
                    entity_id: "switch.ihoment_h5082_{{ repeat.item }}"
                    message: >-
                      {{ label }}: turned OFF by "Dump OFF Sungold charge sockets: pack recovered": Sungold {{ states('sensor.sungold_sph302480a_battery_voltage') }} V. Cooldown 10 min.

  - id: dump_sph_charge_source_stop
    alias: "Dump OFF Sungold charge sockets: feeding bank low"
    description: >
      Sungold charge is enabled and a feeding bank named by a socket's Inverter
      helper has stayed under the source stop volts helper for the dwell helper.
      Turns that Sungold charge socket off even during the minimum on time, then
      starts its cooldown, so a sagging T2 or KU pack is not kept on the inlet.
      A held socket is skipped only while hold also blocks turn-offs. Does not
      switch sockets whose Use is dump.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.sph_charge_source_stop
        to: "on"
        for:
          seconds: "{{ states('input_number.sph_charge_dwell_s') | int(0) }}"
    conditions:
      - condition: state
        entity_id: input_boolean.sph_charge_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.sph_charge_source_stop
        state: "on"
        for:
          seconds: "{{ states('input_number.sph_charge_dwell_s') | int(0) }}"
    actions:
      - variables:
          targets: >
            {% set stop = states('input_number.sph_charge_source_stop_v') %}
            {% set ns = namespace(out=[]) %}
            {% for s in [
              '2f9d_left', '2f9d_right', '3013_left', '3013_right', '3ec9_left', '3ec9_right',
              '82fb_left', '82fb_right', '9607_left', '9607_right', 'c061_left', 'c061_right',
              'c38d_left', 'c38d_right', 'cf79_left', 'cf79_right'
            ] %}
              {% set bus = states('input_select.h5082_' ~ s ~ '_inverter') %}
              {% set rawv = states('sensor.battery_1_voltage') if bus == 'T2' else (states('sensor.battery_2_voltage') if bus == 'KU' else 'none') %}
              {% if is_state('input_select.h5082_' ~ s ~ '_use', 'Sungold charge')
                 and (bus == 'T2' or bus == 'KU')
                 and is_state('switch.ihoment_h5082_' ~ s, 'on')
                 and (states('timer.h5082_' ~ s ~ '_hold') not in ['active', 'paused'] or not is_state('input_boolean.dump_hold_blocks_turn_off', 'on'))
                 and is_number(rawv) and is_number(stop) and (rawv | float) < (stop | float) %}
                {% set ns.out = ns.out + [s] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ is_state('switch.ihoment_h5082_' ~ repeat.item, 'on') }}"
              then:
                - event: dump_control_switching
                  event_data:
                    sock: "{{ repeat.item }}"
                    state: "off"
                - action: switch.turn_off
                  target:
                    entity_id: "switch.ihoment_h5082_{{ repeat.item }}"
                - action: timer.cancel
                  target:
                    entity_id: "timer.h5082_{{ repeat.item }}_min_on"
                - action: timer.start
                  target:
                    entity_id: "timer.h5082_{{ repeat.item }}_cooldown"
                - variables:
                    sock: "{{ repeat.item }}"
                - *socket_label
                - action: logbook.log
                  data:
                    name: Dump control
                    entity_id: "switch.ihoment_h5082_{{ repeat.item }}"
                    message: >-
                      {{ label }}: turned OFF by "Dump OFF Sungold charge sockets: feeding bank low": T2 {{ states('sensor.battery_1_voltage') }} V, KU {{ states('sensor.battery_2_voltage') }} V, stop {{ states('input_number.sph_charge_source_stop_v') }} V. Cooldown 10 min.

  - id: dump_sph_charge_inlet_dark
    alias: "Dump ALERT Sungold charge: inlet has no power"
    description: >
      A socket whose Use is Sungold charge has been on, but Sungold grid voltage
      and charging power have both stayed at or below zero for the inlet confirm
      helper. Posts a notification and a phone text when the alert service is set.
      Does not turn the socket off. The usual causes are a plug that did not switch,
      or the Sungold panel set so it will not charge from mains.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.sph_charge_inlet_dark
        to: "on"
        for:
          seconds: "{{ states('input_number.sph_charge_confirm_s') | int(0) }}"
    conditions:
      - condition: state
        entity_id: input_boolean.sph_charge_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.sph_charge_inlet_dark
        state: "on"
        for:
          seconds: "{{ states('input_number.sph_charge_confirm_s') | int(0) }}"
    actions:
      - variables:
          msg: >-
            A Sungold charge socket is on, but Sungold grid voltage is
            {{ states('sensor.sungold_sph302480a_grid_voltage') }} V and charging power is
            {{ states('sensor.sungold_sph302480a_charging_power') }} W after
            {{ states('input_number.sph_charge_confirm_s') }} s.
            The plug may be unreachable, or the Sungold panel may be set to charge from solar only.
            Mains charging has to be allowed on the inverter panel or the inlet will not charge the pack.
          svc: "{{ states('input_text.dump_notify_service') | trim }}"
      - action: notify.persistent_notification
        data:
          title: Sungold charge inlet has no power
          message: "{{ msg }}"
      - if:
          - condition: template
            value_template: "{{ svc not in ['persistent_notification', '', 'unknown', 'unavailable', 'none'] }}"
        then:
          - action: "notify.{{ svc }}"
            data:
              title: Sungold charge inlet has no power
              message: "{{ msg }}"

  - id: dump_hold_start
    alias: "Dump HOLD start: dump socket switched by hand"
    description: >
      A dump socket (Use dump, Inverter not House) or a Sungold charge socket (Inverter
      T2 or KU) turned on or off and dump control did not ask for it: a Plugs button tap,
      the plug's own button, another automation or an app. Starts that socket's hold timer
      for "Dump manual hold" minutes (0 = off) so the automatic rules leave it alone, and
      logs it. A change that matches a dump control request from the last 3 minutes
      (sensor.dump_control_switching) is not a hand switch. Runs even while the master
      switch is off, so turning it on later does not undo you.
    mode: queued
    max: 32
    triggers:
      - trigger: state
        entity_id:
          - switch.ihoment_h5082_2f9d_left
          - switch.ihoment_h5082_2f9d_right
          - switch.ihoment_h5082_3013_left
          - switch.ihoment_h5082_3013_right
          - switch.ihoment_h5082_3ec9_left
          - switch.ihoment_h5082_3ec9_right
          - switch.ihoment_h5082_82fb_left
          - switch.ihoment_h5082_82fb_right
          - switch.ihoment_h5082_9607_left
          - switch.ihoment_h5082_9607_right
          - switch.ihoment_h5082_c061_left
          - switch.ihoment_h5082_c061_right
          - switch.ihoment_h5082_c38d_left
          - switch.ihoment_h5082_c38d_right
          - switch.ihoment_h5082_cf79_left
          - switch.ihoment_h5082_cf79_right
        from:
          - "on"
          - "off"
        to:
          - "on"
          - "off"
    variables:
      sock: "{{ trigger.entity_id | replace('switch.ihoment_h5082_', '') }}"
      hold_min: "{{ states('input_number.dump_manual_hold_min') | int(0) }}"
      by_dump: >-
        {%- set reqs = state_attr('sensor.dump_control_switching', 'intents') -%}
        {%- set i = reqs.get(sock) if reqs is mapping else none -%}
        {{ i is not none and i[0] == trigger.to_state.state
           and (as_timestamp(now()) - (i[1] | float(0))) < 180 }}
    actions:
      - if:
          - condition: template
            value_template: "{{ by_dump }}"
        then:
          # Dump control's own change: use the request up so a later hand switch to
          # the same state inside the 3 minutes still counts as a hand switch.
          - event: dump_control_switching
            event_data:
              sock: "{{ sock }}"
              state: "done"
          - stop: dump control asked for this change
      - condition: template
        value_template: "{{ ((is_state('input_select.h5082_' ~ sock ~ '_use', 'dump') and not is_state('input_select.h5082_' ~ sock ~ '_inverter', 'House')) or (is_state('input_select.h5082_' ~ sock ~ '_use', 'Sungold charge') and (is_state('input_select.h5082_' ~ sock ~ '_inverter', 'T2') or is_state('input_select.h5082_' ~ sock ~ '_inverter', 'KU')))) and hold_min > 0 }}"
      - action: timer.start
        target:
          entity_id: "timer.h5082_{{ sock }}_hold"
        data:
          duration: "{{ '%02d:%02d:00' % (hold_min // 60, hold_min % 60) }}"
      - *socket_label
      - action: logbook.log
        data:
          name: Dump control
          entity_id: "{{ trigger.entity_id }}"
          message: >-
            {{ label }}: switched {{ trigger.to_state.state | upper }} by hand (Plugs button, the
            plug's own button, Turn next dump ON, Turn dumps OFF, or another app), not by an
            automatic dump or Sungold charge rule. Hold {{ hold_min }} min: those rules leave it alone until
            {{ (now() + timedelta(minutes=hold_min)).strftime('%H:%M') }}.

  - id: dump_hold_end
    alias: "Dump HOLD end: automatic control resumes"
    description: >
      A socket's manual hold timer went back to idle (time up, or cleared with Clear all
      holds or the timer's Cancel). Logs it. The dump turn-off rules only fire when their
      condition starts, so if the master switch is on and this dump socket is still on
      while dump control would want it off right now (solar gone, T2 charger left
      absorption/float, Sungold load above solar, the Sungold voltage guard, its bus at
      stop volts or its battery past the limit), it is turned off with a cooldown.
      A Sungold charge socket is turned off here only when charge control is enabled and
      the pack no longer needs charge or its feeding bank is under the source stop helper.
      Dump reasons such as solar gone do not turn a Sungold charge socket off.
      Turning a dump socket on resumes by itself through sensor.dump_next_plug.
    mode: queued
    max: 32
    triggers:
      - trigger: state
        entity_id:
          - timer.h5082_2f9d_left_hold
          - timer.h5082_2f9d_right_hold
          - timer.h5082_3013_left_hold
          - timer.h5082_3013_right_hold
          - timer.h5082_3ec9_left_hold
          - timer.h5082_3ec9_right_hold
          - timer.h5082_82fb_left_hold
          - timer.h5082_82fb_right_hold
          - timer.h5082_9607_left_hold
          - timer.h5082_9607_right_hold
          - timer.h5082_c061_left_hold
          - timer.h5082_c061_right_hold
          - timer.h5082_c38d_left_hold
          - timer.h5082_c38d_right_hold
          - timer.h5082_cf79_left_hold
          - timer.h5082_cf79_right_hold
        from: "active"
        to: "idle"
    variables:
      sock: "{{ trigger.entity_id | replace('timer.h5082_', '') | replace('_hold', '') }}"
      target: "{{ 'switch.ihoment_h5082_' ~ sock }}"
      bus: "{{ states('input_select.h5082_' ~ sock ~ '_inverter') }}"
      time_up: >-
        {{ as_timestamp(trigger.from_state.attributes.get('finishes_at'), 0) <= as_timestamp(now()) + 5 }}
      why_off: >-
        {%- set b = {'T2': 't2', 'KU': 'ku', 'Sungold': 'sph'}.get(bus, '') -%}
        {%- if not is_state('binary_sensor.dump_solar_present', 'on') -%}solar gone
        {%- elif not is_state('binary_sensor.dump_charge_ok', 'on') -%}T2 charger left absorption/float
        {%- elif is_state('binary_sensor.dump_load_exceeds_solar', 'on') -%}Sungold load above solar
        {%- elif bus == 'Sungold' and is_state('binary_sensor.dump_sph_vguard', 'on') -%}Sungold voltage guard
        {%- elif b and is_state('binary_sensor.dump_v_rebulk_' ~ b, 'on') -%}{{ bus }} bus at stop volts
        {%- elif b and not is_state('binary_sensor.dump_batt_' ~ b ~ '_ok', 'on') -%}{{ bus }} battery past its discharge limit
        {%- endif -%}
    actions:
      - *socket_label
      - action: logbook.log
        data:
          name: Dump control
          entity_id: "{{ target }}"
          message: >-
            {{ label }}: hold ended ({{ 'time up' if time_up else 'cleared' }}); automatic rules may
            switch it again.
      - if:
          - condition: state
            entity_id: input_boolean.dump_control_enabled
            state: "on"
          - condition: template
            value_template: "{{ (is_state('input_select.h5082_' ~ sock ~ '_use', 'dump') and not is_state('input_select.h5082_' ~ sock ~ '_inverter', 'House')) and is_state(target, 'on') and why_off != '' }}"
        then:
          - event: dump_control_switching
            event_data:
              sock: "{{ sock }}"
              state: "off"
          - action: switch.turn_off
            target:
              entity_id: "{{ target }}"
          - action: timer.cancel
            target:
              entity_id: "timer.h5082_{{ sock }}_min_on"
          - action: timer.start
            target:
              entity_id: "timer.h5082_{{ sock }}_cooldown"
          - action: logbook.log
            data:
              name: Dump control
              entity_id: "{{ target }}"
              message: >-
                {{ label }}: turned OFF by "Dump HOLD end: automatic control resumes": the hold ended
                while {{ why_off }}. Cooldown 10 min.
      - if:
          - condition: state
            entity_id: input_boolean.sph_charge_enabled
            state: "on"
          - condition: template
            value_template: >-
              {{ is_state('input_select.h5082_' ~ sock ~ '_use', 'Sungold charge')
                 and (is_state('input_select.h5082_' ~ sock ~ '_inverter', 'T2') or is_state('input_select.h5082_' ~ sock ~ '_inverter', 'KU'))
                 and is_state(target, 'on')
                 and (not is_state('binary_sensor.sph_charge_need', 'on')
                      or (is_number(states('sensor.battery_1_voltage') if bus == 'T2' else states('sensor.battery_2_voltage'))
                          and is_number(states('input_number.sph_charge_source_stop_v'))
                          and ((states('sensor.battery_1_voltage') if bus == 'T2' else states('sensor.battery_2_voltage')) | float)
                              < (states('input_number.sph_charge_source_stop_v') | float))) }}
        then:
          - event: dump_control_switching
            event_data:
              sock: "{{ sock }}"
              state: "off"
          - action: switch.turn_off
            target:
              entity_id: "{{ target }}"
          - action: timer.cancel
            target:
              entity_id: "timer.h5082_{{ sock }}_min_on"
          - action: timer.start
            target:
              entity_id: "timer.h5082_{{ sock }}_cooldown"
          - action: logbook.log
            data:
              name: Dump control
              entity_id: "{{ target }}"
              message: >-
                {{ label }}: turned OFF by "Dump HOLD end: automatic control resumes": the hold ended
                while Sungold charge wanted the socket off. Cooldown 10 min.

# Manual only. Nothing in this repo calls it: no automation, no startup hook, no timer.
# The Site solar button asks for confirmation first. It writes the recommended starting
# values from docs/site-solar/*.md into the dump number helpers and turns
# "Dump ignore SoC" and "Dump hold also blocks turn-offs" on. It does NOT touch the master switch, the notify service, any
# socket Use / Inverter / label, or any switch.
script:
  dump_load_recommended_defaults:
    alias: "Dump settings: load recommended starting values"
    description: >
      Manual button. Replaces the dump volt, watt, SoC and confirm numbers with the
      recommended starting values (27.0 V start / 26.8 V stop on every bus, 2000 W AC
      limits, 0/0/50 W battery discharge, 50 W min solar, 95 % SoC, 5 s, 25 W, 60 min
      manual hold, Sungold voltage guard floor 25.6 V, margin 0.30 V, hysteresis 0.10 V,
      dwell 60 s) and turns Dump ignore SoC and Dump hold also blocks turn-offs on. It
      does not turn the voltage guard on, does not touch skip cooldown, and does not
      change the Sungold inlet charge numbers or its enable control. Use once on
      a fresh install, or to undo bad tuning.
    icon: mdi:backup-restore
    mode: single
    sequence:
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.dump_float_t2_v
            - input_number.dump_float_ku_v
            - input_number.dump_float_sph_v
        data:
          value: 27.0
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.dump_rebulk_t2_v
            - input_number.dump_rebulk_ku_v
            - input_number.dump_rebulk_sph_v
        data:
          value: 26.8
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.dump_ac_limit_t2_w
            - input_number.dump_ac_limit_ku_w
            - input_number.dump_ac_limit_sph_w
        data:
          value: 2000
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.dump_max_discharge_t2_w
            - input_number.dump_max_discharge_ku_w
        data:
          value: 0
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_max_discharge_sph_w
        data:
          value: 50
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_min_solar_w
        data:
          value: 50
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_min_soc_percent
        data:
          value: 95
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_site_confirm_s
        data:
          value: 5
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_site_delta_min_w
        data:
          value: 25
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_manual_hold_min
        data:
          value: 60
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_sph_vguard_floor_v
        data:
          value: 25.6
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_sph_vguard_margin_v
        data:
          value: 0.3
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_sph_vguard_hysteresis_v
        data:
          value: 0.1
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_sph_vguard_dwell_s
        data:
          value: 60
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.dump_soc_unsynced
            - input_boolean.dump_hold_blocks_turn_off
      - action: logbook.log
        data:
          name: Dump control
          entity_id: script.dump_load_recommended_defaults
          message: >-
            loaded the recommended starting values into the dump settings, including
            the Sungold voltage guard numbers, and left the guard switch off (someone
            pressed the button).

  dump_clear_holds:
    alias: "Dump hold: clear all manual holds"
    description: >
      Manual button. Cancels every socket's manual hold timer, so the dump rules may
      switch those sockets again right away ("Dump HOLD end" logs each one).
    icon: mdi:hand-back-right-off
    mode: single
    sequence:
      - action: timer.cancel
        target:
          entity_id:
            - timer.h5082_2f9d_left_hold
            - timer.h5082_2f9d_right_hold
            - timer.h5082_3013_left_hold
            - timer.h5082_3013_right_hold
            - timer.h5082_3ec9_left_hold
            - timer.h5082_3ec9_right_hold
            - timer.h5082_82fb_left_hold
            - timer.h5082_82fb_right_hold
            - timer.h5082_9607_left_hold
            - timer.h5082_9607_right_hold
            - timer.h5082_c061_left_hold
            - timer.h5082_c061_right_hold
            - timer.h5082_c38d_left_hold
            - timer.h5082_c38d_right_hold
            - timer.h5082_cf79_left_hold
            - timer.h5082_cf79_right_hold
      - action: logbook.log
        data:
          name: Dump control
          entity_id: script.dump_clear_holds
          message: >-
            cleared every manual hold (someone pressed Clear all holds).

  dump_force_on:
    alias: "Dump on demand: turn next dump socket on"
    description: >
      Manual button. Turns on the one socket named by sensor.dump_ondemand_on (Use
      dump, Inverter not House, off, not on hold, cooldown idle unless skip cooldown
      is on, and not a Sungold socket while the voltage guard is on). Does not fire
      dump_control_switching, so when the plug reports on, Dump HOLD start arms the
      manual hold. Cancels that socket's cooldown after it reports on. If skip
      cooldown was on, turns that switch off. Does nothing when the sensor is none.
    icon: mdi:power-plug
    mode: single
    sequence:
      - variables:
          target: "{{ states('sensor.dump_ondemand_on') }}"
          sock: "{{ states('sensor.dump_ondemand_on') | replace('switch.ihoment_h5082_', '') }}"
          skip: "{{ is_state('input_boolean.dump_skip_cooldown', 'on') }}"
      - condition: template
        value_template: "{{ target is string and target.startswith('switch.ihoment_h5082_') }}"
      - *socket_label
      - action: logbook.log
        data:
          name: Dump control
          entity_id: "{{ target }}"
          message: >-
            {{ label }}: Turn next dump ON pressed. Asking the socket to turn on.
            Manual hold starts when the plug reports the new state, if Dump manual hold
            is above 0.
      - action: switch.turn_on
        target:
          entity_id: "{{ target }}"
      - wait_template: "{{ is_state(target, 'on') }}"
        timeout: "00:02:00"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ wait.completed }}"
        then:
          - action: timer.cancel
            target:
              entity_id: "timer.h5082_{{ sock }}_cooldown"
          - if:
              - condition: template
                value_template: "{{ skip in [true, 'True', 'true'] }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.dump_skip_cooldown
          - action: logbook.log
            data:
              name: Dump control
              entity_id: "{{ target }}"
              message: >-
                {{ label }}: plug reported on after Turn next dump ON.
                {% if skip in [true, 'True', 'true'] %}Skip cooldown was on and is now off.{% endif %}
        else:
          - action: logbook.log
            data:
              name: Dump control
              entity_id: "{{ target }}"
              message: >-
                {{ label }}: Turn next dump ON: plug did not report on within 2 min.
                Skip cooldown was left as it was. No hold from this press.

  dump_force_off:
    alias: "Dump on demand: turn dump sockets off"
    description: >
      Manual button. Turns off every dump socket that sensor.dump_ondemand_off lists
      (on, Use dump, Inverter not House, not on hold). Does not fire
      dump_control_switching, so when each plug reports off, Dump HOLD start arms that
      socket's manual hold. Starts each socket's cooldown unless skip cooldown was on,
      in which case those cooldowns are cancelled and the skip switch turns off after
      the first plug that reports off. Sockets already on hold are left alone.
    icon: mdi:power-plug-off
    mode: single
    sequence:
      - variables:
          skip: "{{ is_state('input_boolean.dump_skip_cooldown', 'on') }}"
          targets: >
            {% set ns = namespace(out=[]) %}
            {% for s in [
              '2f9d_left', '2f9d_right', '3013_left', '3013_right', '3ec9_left', '3ec9_right',
              '82fb_left', '82fb_right', '9607_left', '9607_right', 'c061_left', 'c061_right',
              'c38d_left', 'c38d_right', 'cf79_left', 'cf79_right'
            ] %}
              {% if (is_state('input_select.h5082_' ~ s ~ '_use', 'dump') and not is_state('input_select.h5082_' ~ s ~ '_inverter', 'House')) and states('timer.h5082_' ~ s ~ '_hold') not in ['active', 'paused']
                 and is_state('switch.ihoment_h5082_' ~ s, 'on') %}
                {% set ns.out = ns.out + [s] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - condition: template
        value_template: "{{ (targets | string | trim) not in ['[]', '', 'None', 'none'] }}"
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - variables:
                sock: "{{ repeat.item }}"
            - *socket_label
            - action: logbook.log
              data:
                name: Dump control
                entity_id: "switch.ihoment_h5082_{{ repeat.item }}"
                message: >-
                  {{ label }}: Turn dumps OFF pressed. Asking the socket to turn off.
                  Manual hold starts when the plug reports off, if Dump manual hold is above 0.
            - action: switch.turn_off
              target:
                entity_id: "switch.ihoment_h5082_{{ repeat.item }}"
            - wait_template: "{{ is_state('switch.ihoment_h5082_' ~ repeat.item, 'off') }}"
              timeout: "00:02:00"
              continue_on_timeout: true
            - if:
                - condition: template
                  value_template: "{{ wait.completed }}"
              then:
                - action: timer.cancel
                  target:
                    entity_id: "timer.h5082_{{ repeat.item }}_min_on"
                - if:
                    - condition: template
                      value_template: "{{ skip in [true, 'True', 'true'] }}"
                  then:
                    - action: timer.cancel
                      target:
                        entity_id: "timer.h5082_{{ repeat.item }}_cooldown"
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.dump_skip_cooldown
                  else:
                    - action: timer.start
                      target:
                        entity_id: "timer.h5082_{{ repeat.item }}_cooldown"
                - action: logbook.log
                  data:
                    name: Dump control
                    entity_id: "switch.ihoment_h5082_{{ repeat.item }}"
                    message: >-
                      {{ label }}: plug reported off after Turn dumps OFF.
                      {% if skip in [true, 'True', 'true'] %}Skip cooldown was on: no cooldown, and the skip switch is off.{% else %}Cooldown 10 min.{% endif %}
              else:
                - action: logbook.log
                  data:
                    name: Dump control
                    entity_id: "switch.ihoment_h5082_{{ repeat.item }}"
                    message: >-
                      {{ label }}: Turn dumps OFF: plug did not report off within 2 min.
                      Cooldown and skip cooldown were left as they were.
