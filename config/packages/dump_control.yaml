  - id: dump_sph_vguard_shed
    alias: "Dump OFF Sungold sockets: Sungold voltage guard"
    description: >
      Sungold battery voltage has stayed under the guard floor or under the lower of
      the live T2 and KU shunt voltages by the guard margin, for the guard dwell
      helper. Always posts a notification (and a phone text when the alert service is
      set), even if the master switch is off. When the master switch is on, turns off
      every dump socket whose Inverter helper is Sungold and that is not already off,
      unless a manual hold blocks turn-offs. Does not write Sungold inverter settings.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.dump_sph_vguard
        to: "on"
        for:
          seconds: "{{ states('input_number.dump_sph_vguard_dwell_s') | int(0) }}"
      - trigger: state
        entity_id: input_boolean.dump_control_enabled
        to: "on"
    conditions:
      - condition: state
        entity_id: binary_sensor.dump_sph_vguard
        state: "on"
        for:
          seconds: "{{ states('input_number.dump_sph_vguard_dwell_s') | int(0) }}"
    actions:
      - variables:
          targets: >
            {% set ns = namespace(out=[]) %}
            {% for s in [
              '2f9d_left', '2f9d_right', '3013_left', '3013_right', '3ec9_left', '3ec9_right',
              '82fb_left', '82fb_right', '9607_left', '9607_right', 'c061_left', 'c061_right',
              'c38d_left', 'c38d_right', 'cf79_left', 'cf79_right'
            ] %}
              {% if (is_state('input_select.h5082_' ~ s ~ '_use', 'dump') and not is_state('input_select.h5082_' ~ s ~ '_inverter', 'House')) and (states('timer.h5082_' ~ s ~ '_hold') not in ['active', 'paused'] or not is_state('input_boolean.dump_hold_blocks_turn_off', 'on'))
