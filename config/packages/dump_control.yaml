# Manual only. Nothing in this repo calls it: no automation, no startup hook, no timer.
# The Site solar button asks for confirmation first. It writes the recommended starting
# values from docs/site-solar/*.md into the dump number helpers and turns
# "Dump ignore SoC" on. It does NOT touch the master switch, the notify service, any
# socket Use / Inverter / label, or any switch.
script:
  dump_load_recommended_defaults:
    alias: "Dump settings: load recommended starting values"
    description: >
      Manual button. Replaces the dump volt, watt, SoC and confirm numbers with the
      recommended starting values (27.0 V start / 26.8 V stop on every bus, 2000 W AC
      limits, 0/0/50 W battery discharge, 50 W min solar, 95 % SoC, 5 s, 25 W) and
      turns Dump ignore SoC on. Use once on a fresh install, or to undo bad tuning.
    icon: mdi:backup-restore
    mode: single
    sequence:
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.dump_float_t2_v
            - input_number.dump_float_ku_v
            - input_number.dump_float_sph_v
        data:
          value: 27.0
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.dump_rebulk_t2_v
            - input_number.dump_rebulk_ku_v
            - input_number.dump_rebulk_sph_v
        data:
          value: 26.8
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.dump_ac_limit_t2_w
            - input_number.dump_ac_limit_ku_w
            - input_number.dump_ac_limit_sph_w
        data:
          value: 2000
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.dump_max_discharge_t2_w
            - input_number.dump_max_discharge_ku_w
        data:
          value: 0
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_max_discharge_sph_w
        data:
          value: 50
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_min_solar_w
        data:
          value: 50
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_min_soc_percent
        data:
          value: 95
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_site_confirm_s
        data:
          value: 5
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_site_delta_min_w
        data:
          value: 25
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.dump_soc_unsynced
      - action: logbook.log
        data:
          name: Dump control
          entity_id: script.dump_load_recommended_defaults
          message: >-
            loaded the recommended starting values into the dump settings (someone
            pressed the button).
