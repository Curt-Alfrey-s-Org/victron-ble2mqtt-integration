    name: 82FB right dump manual hold
    restore: true
  h5082_9607_left_hold:
    name: 9607 left dump manual hold
    restore: true
  h5082_9607_right_hold:
    name: 9607 right dump manual hold
    restore: true
  h5082_c061_left_hold:
    name: C061 left dump manual hold
    restore: true
  h5082_c061_right_hold:
    name: C061 right dump manual hold
    restore: true
  h5082_c38d_left_hold:
    name: C38D left dump manual hold
    restore: true
  h5082_c38d_right_hold:
    name: C38D right dump manual hold
    restore: true
  h5082_cf79_left_hold:
    name: CF79 left dump manual hold
    restore: true
  h5082_cf79_right_hold:
    name: CF79 right dump manual hold
    restore: true

template:
  # Dump control's own switch requests. Every dump rule fires the event
  # dump_control_switching (sock, state) right before switch.turn_on / turn_off.
  # The H5082 switches are MQTT switches with a state topic: their state changes carry
  # a fresh context (no user, no parent automation), so context cannot tell a dump rule
  # from a hand switch. `intents` keeps one [state, unix time] per socket; "Dump HOLD
  # start" treats a change that matches a request from the last 3 min as dump control.
  - triggers:
      - trigger: event
        event_type: dump_control_switching
    sensor:
      - name: Dump control switching
        unique_id: dump_control_switching
        default_entity_id: sensor.dump_control_switching
        icon: mdi:robot-outline
        state: "{{ trigger.event.data.sock }} {{ trigger.event.data.state }}"
        attributes:
          intents: >-
            {%- set old = this.attributes.get('intents') if this is defined and this.attributes is defined else none -%}
            {%- set old = old if old is mapping else {} -%}
            {{ dict(old.items() | list + [(trigger.event.data.sock, [trigger.event.data.state, as_timestamp(now()) | round(0)])]) }}
  - sensor:
      - name: Dump sockets
        unique_id: dump_sockets
        default_entity_id: sensor.dump_sockets
        icon: mdi:power-socket-us
        state: >
          {% set ns = namespace(n=0) %}
          {% for s in [
            '2f9d_left', '2f9d_right', '3013_left', '3013_right', '3ec9_left', '3ec9_right',
            '82fb_left', '82fb_right', '9607_left', '9607_right', 'c061_left', 'c061_right',
            'c38d_left', 'c38d_right', 'cf79_left', 'cf79_right'
          ] %}
            {% if (is_state('input_select.h5082_' ~ s ~ '_use', 'dump') and not is_state('input_select.h5082_' ~ s ~ '_inverter', 'House')) %}{% set ns.n = ns.n + 1 %}{% endif %}
          {% endfor %}
          {{ ns.n }}
        attributes:
          entities: >
            {% set ns = namespace(out=[]) %}
            {% for s in [
              '2f9d_left', '2f9d_right', '3013_left', '3013_right', '3ec9_left', '3ec9_right',
              '82fb_left', '82fb_right', '9607_left', '9607_right', 'c061_left', 'c061_right',
              'c38d_left', 'c38d_right', 'cf79_left', 'cf79_right'
            ] %}
              {% if (is_state('input_select.h5082_' ~ s ~ '_use', 'dump') and not is_state('input_select.h5082_' ~ s ~ '_inverter', 'House')) %}
                {% set ns.out = ns.out + ['switch.ihoment_h5082_' ~ s] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
          held: >
            {% set ns = namespace(out=[]) %}
            {% for s in [
              '2f9d_left', '2f9d_right', '3013_left', '3013_right', '3ec9_left', '3ec9_right',
              '82fb_left', '82fb_right', '9607_left', '9607_right', 'c061_left', 'c061_right',
              'c38d_left', 'c38d_right', 'cf79_left', 'cf79_right'
            ] %}
              {% if states('timer.h5082_' ~ s ~ '_hold') in ['active', 'paused'] %}
                {% set ns.out = ns.out + ['switch.ihoment_h5082_' ~ s] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - name: Dump surplus
        unique_id: dump_surplus_w
        default_entity_id: sensor.dump_surplus_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        # Briefing only. H5082 reports no watts, so this is T2 MPPT PV watts; dump
        # load already shows in the Sungold / pack meters. Its derivative is PV falling.
        state: >
          {% set solar_live = states('sensor.solar_controller_solar') %}
          {% set solar_canon = states('sensor.solar_controller_solar_power') %}
          {% set solar = solar_live if is_number(solar_live) else solar_canon %}
          {% if not is_number(solar) %}
            {{ none }}
          {% else %}
            {{ solar | float(0) }}
          {% endif %}
      - name: Dump bus load T2
        unique_id: dump_bus_load_t2
        default_entity_id: sensor.dump_bus_load_t2
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set p = states('sensor.battery_1_power') %}
          {{ (-1 * (p | float)) if is_number(p) else none }}
      - name: Dump bus load KU
        unique_id: dump_bus_load_ku
        default_entity_id: sensor.dump_bus_load_ku
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set p = states('sensor.battery_2_power') %}
          {{ (-1 * (p | float)) if is_number(p) else none }}
      - name: Dump bus load Sungold
        unique_id: dump_bus_load_sph
        default_entity_id: sensor.dump_bus_load_sph
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set p = states('sensor.sungold_sph302480a_load_power') %}
          {{ (p | float) if is_number(p) else none }}
      - name: Dump next plug
        unique_id: dump_next_plug
        default_entity_id: sensor.dump_next_plug
        icon: mdi:power-socket-us
        state: >
          {% set socks = [
            '2f9d_left', '2f9d_right', '3013_left', '3013_right', '3ec9_left', '3ec9_right',
            '82fb_left', '82fb_right', '9607_left', '9607_right', 'c061_left', 'c061_right',
            'c38d_left', 'c38d_right', 'cf79_left', 'cf79_right'
          ] %}
          {% set lim_t2 = states('input_number.dump_ac_limit_t2_w') | float(2000) %}
          {% set lim_ku = states('input_number.dump_ac_limit_ku_w') | float(2000) %}
          {% set lim_sph = states('input_number.dump_ac_limit_sph_w') | float(2000) %}
          {% set sg = states('sensor.sungold_sph302480a_load_power') | float(0)
             if is_number(states('sensor.sungold_sph302480a_load_power')) else 0 %}
          {% set t2_pack = states('sensor.battery_1_power') | float(0)
             if is_number(states('sensor.battery_1_power')) else 0 %}
          {% set ku_pack = states('sensor.battery_2_power') | float(0)
             if is_number(states('sensor.battery_2_power')) else 0 %}
          {% set t2_from_batt = [0, -t2_pack] | max %}
          {% set ku_from_batt = [0, -ku_pack] | max %}
          {% set head = {
            'T2': lim_t2 - t2_from_batt,
            'KU': lim_ku - ku_from_batt,
            'Sungold': lim_sph - sg,
          } %}
          {% set batt = {
            'T2': is_state('binary_sensor.dump_batt_t2_ok', 'on'),
            'KU': is_state('binary_sensor.dump_batt_ku_ok', 'on'),
            'Sungold': is_state('binary_sensor.dump_batt_sph_ok', 'on'),
          } %}
          {% set vfloat = {
            'T2': is_state('binary_sensor.dump_v_float_t2', 'on'),
            'KU': is_state('binary_sensor.dump_v_float_ku', 'on'),
            'Sungold': is_state('binary_sensor.dump_v_float_sph', 'on'),
          } %}
          {% set vrebulk = {
            'T2': is_state('binary_sensor.dump_v_rebulk_t2', 'on'),
            'KU': is_state('binary_sensor.dump_v_rebulk_ku', 'on'),
            'Sungold': is_state('binary_sensor.dump_v_rebulk_sph', 'on'),
          } %}
          {% if not is_state('binary_sensor.dump_solar_present', 'on')
             or not is_state('binary_sensor.dump_charge_float', 'on')
             or not is_state('binary_sensor.dump_soc_ok', 'on') %}
            none
          {% else %}
            {% set pick = namespace(eid='none') %}
            {% for s in socks %}
              {% set eid = 'switch.ihoment_h5082_' ~ s %}
              {% set bus = states('input_select.h5082_' ~ s ~ '_inverter') %}
              {% if pick.eid == 'none'
                 and (is_state('input_select.h5082_' ~ s ~ '_use', 'dump') and not is_state('input_select.h5082_' ~ s ~ '_inverter', 'House')) and states('timer.h5082_' ~ s ~ '_hold') not in ['active', 'paused']
                 and is_state(eid, 'off')
                 and (is_state('timer.h5082_' ~ s ~ '_cooldown', 'idle') or is_state('input_boolean.dump_skip_cooldown', 'on'))
                 and not (bus == 'Sungold' and is_state('binary_sensor.dump_sph_vguard', 'on'))
                 and batt.get(bus, False)
                 and vfloat.get(bus, False) and not vrebulk.get(bus, False)
                 and head.get(bus, -1) > 0 %}
                {% set pick.eid = eid %}
              {% endif %}
            {% endfor %}
            {{ pick.eid }}
          {% endif %}
        attributes:
          surplus_w: "{{ states('sensor.dump_surplus_w') | float(0) if is_number(states('sensor.dump_surplus_w')) else none }}"
          sungold_load_w: "{{ states('sensor.sungold_sph302480a_load_power') | float(0) if is_number(states('sensor.sungold_sph302480a_load_power')) else 0 }}"
          t2_pack_w: "{{ states('sensor.battery_1_power') | float(0) if is_number(states('sensor.battery_1_power')) else none }}"
          ku_pack_w: "{{ states('sensor.battery_2_power') | float(0) if is_number(states('sensor.battery_2_power')) else none }}"
          charge_float: "{{ is_state('binary_sensor.dump_charge_float', 'on') }}"
          solar_present: "{{ is_state('binary_sensor.dump_solar_present', 'on') }}"
      - name: Dump shed plug
        unique_id: dump_shed_plug
        default_entity_id: sensor.dump_shed_plug
        icon: mdi:power-socket-us
        state: >
          {% set pick = namespace(eid='none') %}
          {% for s in [
            '2f9d_left', '2f9d_right', '3013_left', '3013_right', '3ec9_left', '3ec9_right',
            '82fb_left', '82fb_right', '9607_left', '9607_right', 'c061_left', 'c061_right',
            'c38d_left', 'c38d_right', 'cf79_left', 'cf79_right'
          ] | reverse %}
            {% set eid = 'switch.ihoment_h5082_' ~ s %}
            {% if pick.eid == 'none' and (is_state('input_select.h5082_' ~ s ~ '_use', 'dump') and not is_state('input_select.h5082_' ~ s ~ '_inverter', 'House')) and (states('timer.h5082_' ~ s ~ '_hold') not in ['active', 'paused'] or not is_state('input_boolean.dump_hold_blocks_turn_off', 'on'))
               and is_state(eid, 'on') %}
              {% set pick.eid = eid %}
            {% endif %}
          {% endfor %}
          {{ pick.eid }}
      - name: Dump on demand next on
        unique_id: dump_ondemand_on
        default_entity_id: sensor.dump_ondemand_on
        icon: mdi:power-plug
        # What "Turn next dump ON" would switch. Same socket order as dump_next_plug,
        # but it does not wait for float, solar, SoC, start volts, battery or AC headroom.
        # It still skips a held socket, a cooldown (unless skip cooldown is on), House,
        # and a Sungold socket while the voltage guard is on.
        state: >
          {% set skip = is_state('input_boolean.dump_skip_cooldown', 'on') %}
          {% set pick = namespace(eid='none') %}
          {% for s in [
            '2f9d_left', '2f9d_right', '3013_left', '3013_right', '3ec9_left', '3ec9_right',
            '82fb_left', '82fb_right', '9607_left', '9607_right', 'c061_left', 'c061_right',
            'c38d_left', 'c38d_right', 'cf79_left', 'cf79_right'
          ] %}
            {% set eid = 'switch.ihoment_h5082_' ~ s %}
            {% set bus = states('input_select.h5082_' ~ s ~ '_inverter') %}
            {% if pick.eid == 'none'
               and (is_state('input_select.h5082_' ~ s ~ '_use', 'dump') and not is_state('input_select.h5082_' ~ s ~ '_inverter', 'House')) and states('timer.h5082_' ~ s ~ '_hold') not in ['active', 'paused']
               and is_state(eid, 'off')
               and (is_state('timer.h5082_' ~ s ~ '_cooldown', 'idle') or skip)
               and not (bus == 'Sungold' and is_state('binary_sensor.dump_sph_vguard', 'on')) %}
              {% set pick.eid = eid %}
            {% endif %}
          {% endfor %}
          {{ pick.eid }}
      - name: Dump on demand off count
        unique_id: dump_ondemand_off
        default_entity_id: sensor.dump_ondemand_off
        icon: mdi:power-plug-off
        # How many dump sockets "Turn dumps OFF" would switch: on, not House, not on hold.
        state: >
          {% set ns = namespace(n=0) %}
          {% for s in [
            '2f9d_left', '2f9d_right', '3013_left', '3013_right', '3ec9_left', '3ec9_right',
            '82fb_left', '82fb_right', '9607_left', '9607_right', 'c061_left', 'c061_right',
            'c38d_left', 'c38d_right', 'cf79_left', 'cf79_right'
          ] %}
            {% if (is_state('input_select.h5082_' ~ s ~ '_use', 'dump') and not is_state('input_select.h5082_' ~ s ~ '_inverter', 'House')) and states('timer.h5082_' ~ s ~ '_hold') not in ['active', 'paused']
               and is_state('switch.ihoment_h5082_' ~ s, 'on') %}
              {% set ns.n = ns.n + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.n }}
        attributes:
          sockets: >
            {% set ns = namespace(out=[]) %}
            {% for s in [
              '2f9d_left', '2f9d_right', '3013_left', '3013_right', '3ec9_left', '3ec9_right',
              '82fb_left', '82fb_right', '9607_left', '9607_right', 'c061_left', 'c061_right',
              'c38d_left', 'c38d_right', 'cf79_left', 'cf79_right'
            ] %}
              {% if (is_state('input_select.h5082_' ~ s ~ '_use', 'dump') and not is_state('input_select.h5082_' ~ s ~ '_inverter', 'House')) and states('timer.h5082_' ~ s ~ '_hold') not in ['active', 'paused']
                 and is_state('switch.ihoment_h5082_' ~ s, 'on') %}
                {% set ns.out = ns.out + [s] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - name: Dump Sungold voltage gap
        unique_id: dump_sph_vguard_gap
        default_entity_id: sensor.dump_sph_vguard_gap
        unit_of_measurement: V
        state_class: measurement
        icon: mdi:delta
        # Sungold battery volts minus the lower of the live T2 and KU shunt volts.
        # Negative means Sungold is below that shunt. None when a side is missing.
        state: >
          {% set raw_v = states('sensor.sungold_sph302480a_battery_voltage') %}
          {% set raw_t2 = states('sensor.battery_1_voltage') %}
          {% set raw_ku = states('sensor.battery_2_voltage') %}
          {% set refs = [] %}
          {% if is_number(raw_t2) %}{% set refs = refs + [raw_t2 | float] %}{% endif %}
          {% if is_number(raw_ku) %}{% set refs = refs + [raw_ku | float] %}{% endif %}
          {% if is_number(raw_v) and refs %}
            {{ (raw_v | float - (refs | min)) | round(3) }}
          {% else %}
            none
          {% endif %}
      - name: Sungold charge status
        unique_id: sph_charge_status
        default_entity_id: sensor.sph_charge_status
        icon: mdi:battery-charging
        # Short why for the Site solar box. Sockets with Use Sungold charge are not dumps.
        state: >
          {% set enabled = is_state('input_boolean.sph_charge_enabled', 'on') %}
          {% set need = is_state('binary_sensor.sph_charge_need', 'on') %}
          {% set dark = is_state('binary_sensor.sph_charge_inlet_dark', 'on') %}
          {% set ns = namespace(n=0) %}
          {% for s in [
            '2f9d_left', '2f9d_right', '3013_left', '3013_right', '3ec9_left', '3ec9_right',
            '82fb_left', '82fb_right', '9607_left', '9607_right', 'c061_left', 'c061_right',
            'c38d_left', 'c38d_right', 'cf79_left', 'cf79_right'
          ] %}
            {% if is_state('input_select.h5082_' ~ s ~ '_use', 'Sungold charge')
               and is_state('switch.ihoment_h5082_' ~ s, 'on') %}
              {% set ns.n = ns.n + 1 %}
            {% endif %}
          {% endfor %}
          {% if not enabled %}
            disabled
          {% elif dark %}
            inlet dark
          {% elif ns.n > 0 and need %}
            charging
          {% elif ns.n > 0 %}
            min on
          {% elif need %}
            need
          {% else %}
            idle
          {% endif %}
        attributes:
          reason: >
            {% set enabled = is_state('input_boolean.sph_charge_enabled', 'on') %}
            {% set need = is_state('binary_sensor.sph_charge_need', 'on') %}
            {% set dark = is_state('binary_sensor.sph_charge_inlet_dark', 'on') %}
            {% set ns = namespace(n=0) %}
            {% for s in [
              '2f9d_left', '2f9d_right', '3013_left', '3013_right', '3ec9_left', '3ec9_right',
              '82fb_left', '82fb_right', '9607_left', '9607_right', 'c061_left', 'c061_right',
              'c38d_left', 'c38d_right', 'cf79_left', 'cf79_right'
            ] %}
              {% if is_state('input_select.h5082_' ~ s ~ '_use', 'Sungold charge')
                 and is_state('switch.ihoment_h5082_' ~ s, 'on') %}
                {% set ns.n = ns.n + 1 %}
              {% endif %}
            {% endfor %}
            {% if not enabled %}
              charge control is off
            {% elif dark %}
              a Sungold charge socket is on but grid voltage and charging power are not above 0
            {% elif ns.n > 0 and need %}
              pack is low and a Sungold charge socket is on
            {% elif ns.n > 0 %}
              pack recovered; socket stays on until the minimum on time ends or the feeding bank hits stop volts
            {% elif need %}
              pack is low; a socket turns on when its Inverter is T2 or KU, that bank is at the source minimum, and the socket is off, not on hold and not in cooldown
            {% else %}
              Sungold is not below the charge limits
            {% endif %}
  - binary_sensor:
      - name: Dump charge ok
        unique_id: dump_charge_ok
        default_entity_id: binary_sensor.dump_charge_ok
        state: >
          {% set a = states('sensor.solar_controller_charge_state') | lower %}
          {% set b = states('sensor.solar_controller_battery_state') | lower %}
          {{ a in ['absorption', 'float'] or b in ['absorption', 'float'] }}
      - name: Dump batt T2 ok
        unique_id: dump_batt_t2_ok
        default_entity_id: binary_sensor.dump_batt_t2_ok
        state: >
          {% set p = states('sensor.battery_1_power') %}
          {% set lim = states('input_number.dump_max_discharge_t2_w') | float(0) %}
          {{ is_number(p) and (p | float) >= -lim }}
      - name: Dump batt KU ok
        unique_id: dump_batt_ku_ok
        default_entity_id: binary_sensor.dump_batt_ku_ok
        state: >
          {% set p = states('sensor.battery_2_power') %}
          {% set lim = states('input_number.dump_max_discharge_ku_w') | float(0) %}
          {{ is_number(p) and (p | float) >= -lim }}
      - name: Dump batt Sungold ok
        unique_id: dump_batt_sph_ok
        default_entity_id: binary_sensor.dump_batt_sph_ok
        state: >
          {% set p = states('sensor.sungold_sph302480a_charging_power') %}
          {% set a = states('sensor.sungold_sph302480a_battery_current') %}
          {% set v = states('sensor.sungold_sph302480a_battery_voltage') %}
          {% set lim = states('input_number.dump_max_discharge_sph_w') | float(50) %}
          {% if is_number(p) %}
            {{ (p | float) >= -lim }}
          {% elif is_number(a) and is_number(v) %}
            {{ ((a | float) * (v | float)) >= -lim }}
          {% else %}
            {{ false }}
          {% endif %}
      - name: Dump charge float
        unique_id: dump_charge_float
        default_entity_id: binary_sensor.dump_charge_float
        state: >
          {% set a = states('sensor.solar_controller_charge_state') | lower %}
          {% set b = states('sensor.solar_controller_battery_state') | lower %}
          {{ a == 'float' or b == 'float' }}
      - name: Dump solar present
        unique_id: dump_solar_present
        default_entity_id: binary_sensor.dump_solar_present
        state: >
          {% set s = states('sensor.solar_controller_solar') %}
          {% set s2 = states('sensor.solar_controller_solar_power') %}
          {% set pv = s if is_number(s) else s2 %}
          {% set minw = states('input_number.dump_min_solar_w') | float(50) %}
          {{ is_number(pv) and (pv | float) >= minw }}
      - name: Dump load exceeds solar
        unique_id: dump_load_exceeds_solar
        default_entity_id: binary_sensor.dump_load_exceeds_solar
        device_class: problem
        state: >
          {% set t2 = states('sensor.solar_controller_solar') %}
          {% set pv = states('sensor.sungold_sph302480a_pv_power') %}
          {% set solar = ((t2 | float(0)) if is_number(t2) else 0) + ((pv | float(0)) if is_number(pv) else 0) %}
          {% set load = states('sensor.sungold_sph302480a_load_power') %}
          {% set minw = states('input_number.dump_min_solar_w') | float(50) %}
          {{ is_number(solar) and is_number(load)
             and (solar | float) >= minw
             and (load | float) > (solar | float) }}
      - name: Dump SoC ok
        unique_id: dump_soc_ok
        default_entity_id: binary_sensor.dump_soc_ok
        state: >
          {% if is_state('input_boolean.dump_soc_unsynced', 'on') %}
            {{ true }}
          {% else %}
            {% set s = states('sensor.battery_1_state_of_charge') %}
            {% set m = states('input_number.dump_min_soc_percent') | float(95) %}
            {{ is_number(s) and (s | float) >= m }}
          {% endif %}
      - name: Dump T2 float hold
        unique_id: dump_v_float_t2
        default_entity_id: binary_sensor.dump_v_float_t2
        state: >
          {% set v = states('sensor.battery_1_voltage') %}
          {% set fl = states('input_number.dump_float_t2_v') %}
          {{ is_number(v) and is_number(fl) and (v | float) >= (fl | float) }}
      - name: Dump T2 re-bulk
        unique_id: dump_v_rebulk_t2
        default_entity_id: binary_sensor.dump_v_rebulk_t2
        state: >
          {% set v = states('sensor.battery_1_voltage') %}
          {% set rb = states('input_number.dump_rebulk_t2_v') %}
          {{ is_number(v) and is_number(rb) and (v | float) <= (rb | float) }}
      - name: Dump KU float hold
        unique_id: dump_v_float_ku
        default_entity_id: binary_sensor.dump_v_float_ku
        state: >
          {% set v = states('sensor.battery_2_voltage') %}
          {% set fl = states('input_number.dump_float_ku_v') %}
          {{ is_number(v) and is_number(fl) and (v | float) >= (fl | float) }}
      - name: Dump KU re-bulk
        unique_id: dump_v_rebulk_ku
        default_entity_id: binary_sensor.dump_v_rebulk_ku
        state: >
          {% set v = states('sensor.battery_2_voltage') %}
          {% set rb = states('input_number.dump_rebulk_ku_v') %}
          {{ is_number(v) and is_number(rb) and (v | float) <= (rb | float) }}
      - name: Dump Sungold float hold
        unique_id: dump_v_float_sph
        default_entity_id: binary_sensor.dump_v_float_sph
        state: >
          {% set v = states('sensor.sungold_sph302480a_battery_voltage') %}
          {% set fl = states('input_number.dump_float_sph_v') %}
          {{ is_number(v) and is_number(fl) and (v | float) >= (fl | float) }}
      - name: Dump Sungold re-bulk
        unique_id: dump_v_rebulk_sph
        default_entity_id: binary_sensor.dump_v_rebulk_sph
        state: >
          {% set v = states('sensor.sungold_sph302480a_battery_voltage') %}
          {% set rb = states('input_number.dump_rebulk_sph_v') %}
          {{ is_number(v) and is_number(rb) and (v | float) <= (rb | float) }}
      - name: Dump Sungold voltage guard active
        unique_id: dump_sph_vguard
        default_entity_id: binary_sensor.dump_sph_vguard
        device_class: problem
        icon: mdi:battery-alert
        # On when the guard is enabled and Sungold volts are under the floor helper,
        # or under the lower live T2/KU shunt by the margin helper. While already on,
        # both tests stay tripped until the voltage recovers by the hysteresis helper
        # (`this.state`). Off when the guard is disabled or Sungold volts are missing.
        state: >
          {% set enabled = is_state('input_boolean.dump_sph_vguard_enabled', 'on') %}
          {% set raw_v = states('sensor.sungold_sph302480a_battery_voltage') %}
          {% set raw_t2 = states('sensor.battery_1_voltage') %}
          {% set raw_ku = states('sensor.battery_2_voltage') %}
          {% set raw_floor = states('input_number.dump_sph_vguard_floor_v') %}
          {% set raw_margin = states('input_number.dump_sph_vguard_margin_v') %}
          {% set raw_hyst = states('input_number.dump_sph_vguard_hysteresis_v') %}
          {% if not enabled or not is_number(raw_v) or not is_number(raw_floor) or not is_number(raw_margin) or not is_number(raw_hyst) %}
            off
          {% else %}
            {% set sv = raw_v | float %}
            {% set floor = raw_floor | float %}
            {% set margin = raw_margin | float %}
            {% set hyst = raw_hyst | float %}
            {% set refs = [] %}
            {% if is_number(raw_t2) %}{% set refs = refs + [raw_t2 | float] %}{% endif %}
            {% if is_number(raw_ku) %}{% set refs = refs + [raw_ku | float] %}{% endif %}
            {% set low = (refs | min) if refs else none %}
            {% set was = this is defined and this.state is defined and this.state == 'on' %}
            {% set lift = hyst if was else 0 %}
            {% set floor_hit = sv < (floor + lift) %}
            {% set rel_hit = low is not none and sv < (low - margin + lift) %}
            {{ 'on' if floor_hit or rel_hit else 'off' }}
          {% endif %}
        attributes:
          sungold_v: "{{ states('sensor.sungold_sph302480a_battery_voltage') }}"
          t2_v: "{{ states('sensor.battery_1_voltage') }}"
          ku_v: "{{ states('sensor.battery_2_voltage') }}"
          ref_v: >-
            {% set raw_t2 = states('sensor.battery_1_voltage') %}
            {% set raw_ku = states('sensor.battery_2_voltage') %}
            {% set refs = [] %}
            {% if is_number(raw_t2) %}{% set refs = refs + [raw_t2 | float] %}{% endif %}
            {% if is_number(raw_ku) %}{% set refs = refs + [raw_ku | float] %}{% endif %}
            {% if refs %}{{ refs | min }}{% else %}none{% endif %}
          reason: >-
            {% set enabled = is_state('input_boolean.dump_sph_vguard_enabled', 'on') %}
            {% set raw_v = states('sensor.sungold_sph302480a_battery_voltage') %}
            {% set raw_t2 = states('sensor.battery_1_voltage') %}
            {% set raw_ku = states('sensor.battery_2_voltage') %}
            {% set raw_floor = states('input_number.dump_sph_vguard_floor_v') %}
            {% set raw_margin = states('input_number.dump_sph_vguard_margin_v') %}
            {% set raw_hyst = states('input_number.dump_sph_vguard_hysteresis_v') %}
            {% if not enabled %}
              disabled
            {% elif not is_number(raw_v) or not is_number(raw_floor) or not is_number(raw_margin) or not is_number(raw_hyst) %}
              sungold voltage unavailable
            {% else %}
              {% set sv = raw_v | float %}
              {% set floor = raw_floor | float %}
              {% set margin = raw_margin | float %}
              {% set hyst = raw_hyst | float %}
              {% set refs = [] %}
              {% if is_number(raw_t2) %}{% set refs = refs + [raw_t2 | float] %}{% endif %}
              {% if is_number(raw_ku) %}{% set refs = refs + [raw_ku | float] %}{% endif %}
              {% set low = (refs | min) if refs else none %}
              {% set was = this is defined and this.state is defined and this.state == 'on' %}
              {% set lift = hyst if was else 0 %}
              {% set floor_hit = sv < (floor + lift) %}
              {% set rel_hit = low is not none and sv < (low - margin + lift) %}
              {% if floor_hit and rel_hit %}
                below floor and below T2/KU minus margin
              {% elif floor_hit %}
                below floor
              {% elif rel_hit %}
                below T2/KU minus margin
              {% else %}
                clear
              {% endif %}
            {% endif %}
      - name: Sungold charge needed
        unique_id: sph_charge_need
        default_entity_id: binary_sensor.sph_charge_need
        device_class: problem
        icon: mdi:battery-charging-low
        # On while charge control is enabled and the pack should charge: under the floor,
        # under the lower of T2 and KU by the margin, under the optional SoC, or the
        # Sungold voltage guard is on. Once on, stays on until Sungold reaches the full
        # helper or comes within the target gap of that lower shunt, and the guard is
        # off, and the optional SoC is no longer under its helper. Missing Sungold volts
        # do not start a floor or margin trip; if this was already on, they keep it on.
        state: >
          {% set enabled = is_state('input_boolean.sph_charge_enabled', 'on') %}
          {% if not enabled %}
            off
          {% else %}
            {% set raw_v = states('sensor.sungold_sph302480a_battery_voltage') %}
            {% set raw_soc = states('sensor.sungold_sph302480a_battery_soc') %}
            {% set raw_t2 = states('sensor.battery_1_voltage') %}
            {% set raw_ku = states('sensor.battery_2_voltage') %}
            {% set raw_floor = states('input_number.sph_charge_floor_v') %}
            {% set raw_margin = states('input_number.sph_charge_margin_v') %}
            {% set raw_target = states('input_number.sph_charge_target_v') %}
            {% set raw_full = states('input_number.sph_charge_full_v') %}
            {% set raw_soc_below = states('input_number.sph_charge_soc_below') %}
            {% set refs = [] %}
            {% if is_number(raw_t2) %}{% set refs = refs + [raw_t2 | float] %}{% endif %}
            {% if is_number(raw_ku) %}{% set refs = refs + [raw_ku | float] %}{% endif %}
            {% set low = (refs | min) if refs else none %}
            {% set was = this is defined and this.state is defined and this.state == 'on' %}
            {% set guard = is_state('binary_sensor.dump_sph_vguard', 'on') %}
            {% set floor_hit = is_number(raw_v) and is_number(raw_floor) and (raw_v | float) < (raw_floor | float) %}
            {% set margin_hit = is_number(raw_v) and is_number(raw_margin) and low is not none and (raw_v | float) < (low - (raw_margin | float)) %}
            {% set soc_hit = is_state('input_boolean.sph_charge_soc_enabled', 'on') and is_number(raw_soc) and is_number(raw_soc_below) and (raw_soc | float) < (raw_soc_below | float) %}
            {% if was %}
              {% if not is_number(raw_v) %}
                on
              {% else %}
                {% set sv = raw_v | float %}
                {% set full_ok = is_number(raw_full) and sv >= (raw_full | float) %}
                {% set target_ok = is_number(raw_target) and low is not none and sv >= (low - (raw_target | float)) %}
                {% set recovered = (full_ok or target_ok) and not guard and not soc_hit %}
                {{ 'off' if recovered else 'on' }}
              {% endif %}
            {% else %}
              {{ 'on' if floor_hit or margin_hit or soc_hit or guard else 'off' }}
            {% endif %}
          {% endif %}
      - name: Sungold charge inlet dark
        unique_id: sph_charge_inlet_dark
        default_entity_id: binary_sensor.sph_charge_inlet_dark
        device_class: problem
        icon: mdi:power-plug-off
        # A Sungold charge socket is on, but the Sungold is not seeing mains power.
        state: >
          {% set ns = namespace(on=false) %}
          {% for s in [
            '2f9d_left', '2f9d_right', '3013_left', '3013_right', '3ec9_left', '3ec9_right',
            '82fb_left', '82fb_right', '9607_left', '9607_right', 'c061_left', 'c061_right',
            'c38d_left', 'c38d_right', 'cf79_left', 'cf79_right'
          ] %}
            {% if is_state('input_select.h5082_' ~ s ~ '_use', 'Sungold charge')
               and is_state('switch.ihoment_h5082_' ~ s, 'on') %}
              {% set ns.on = true %}
            {% endif %}
          {% endfor %}
          {% set gv = states('sensor.sungold_sph302480a_grid_voltage') %}
          {% set cp = states('sensor.sungold_sph302480a_charging_power') %}
          {% set dark = (not is_number(gv) or (gv | float) <= 0) and (not is_number(cp) or (cp | float) <= 0) %}
          {{ 'on' if ns.on and dark else 'off' }}
      - name: Sungold charge source stop
        unique_id: sph_charge_source_stop
        default_entity_id: binary_sensor.sph_charge_source_stop
        device_class: problem
        icon: mdi:battery-arrow-down
        # On when a Sungold charge socket is on and its feeding bank is under the stop helper.
        # Hold is applied by the turn-off automation, not here.
        state: >
          {% set stop = states('input_number.sph_charge_source_stop_v') %}
          {% set ns = namespace(hit=false) %}
          {% for s in [
            '2f9d_left', '2f9d_right', '3013_left', '3013_right', '3ec9_left', '3ec9_right',
            '82fb_left', '82fb_right', '9607_left', '9607_right', 'c061_left', 'c061_right',
            'c38d_left', 'c38d_right', 'cf79_left', 'cf79_right'
          ] %}
            {% set bus = states('input_select.h5082_' ~ s ~ '_inverter') %}
            {% set rawv = states('sensor.battery_1_voltage') if bus == 'T2' else (states('sensor.battery_2_voltage') if bus == 'KU' else 'none') %}
            {% if is_state('input_select.h5082_' ~ s ~ '_use', 'Sungold charge')
               and (bus == 'T2' or bus == 'KU')
               and is_state('switch.ihoment_h5082_' ~ s, 'on')
               and is_number(rawv) and is_number(stop) and (rawv | float) < (stop | float) %}
              {% set ns.hit = true %}
            {% endif %}
          {% endfor %}
          {{ 'on' if ns.hit else 'off' }}

sensor:
  - platform: derivative
    source: sensor.dump_surplus_w
    name: Dump surplus derivative
    unique_id: dump_surplus_derivative
    round: 1
    unit_time: min
    time_window: "00:15:00"

binary_sensor:
  - platform: threshold
    entity_id: sensor.dump_surplus_w
    name: Dump surplus high
    upper: 125
    hysteresis: 75
  - platform: threshold
    entity_id: sensor.dump_surplus_derivative
    name: Dump PV falling
    lower: 0
    hysteresis: 5

automation dump_load:
  - id: dump_turn_on
    alias: "Dump ON: add dump sockets while the charger is in float"
    description: >
      Adds one dump socket at a time. Starts when the T2 MPPT has been in float for
      1 min and T2 PV has been at or above "Dump min solar" for 1 min, the master
      switch is on, SoC is ok (or ignored), PV is not falling and Sungold load is not
      above solar. sensor.dump_next_plug picks the first OFF dump socket (Use dump,
      Inverter not House) whose cooldown is idle, whose bus is at or above its start
      volts and above its stop
      volts, whose battery is not discharging past its limit and whose inverter is
      under its AC limit. After the plug reports on, waits "Dump confirm wait" and
      keeps it only if that bus's load rose by "Dump confirm min load rise".
      Each step writes the reason to the logbook ("Dump control").
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.dump_charge_float
        to: "on"
        for: "00:01:00"
      - trigger: state
        entity_id: binary_sensor.dump_solar_present
        to: "on"
        for: "00:01:00"
      - trigger: state
        entity_id: sensor.dump_next_plug
    conditions:
      - condition: state
        entity_id: input_boolean.dump_control_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.dump_charge_float
        state: "on"
        for:
          minutes: 1
      - condition: state
        entity_id: binary_sensor.dump_solar_present
        state: "on"
        for:
          minutes: 1
      - condition: state
        entity_id: binary_sensor.dump_soc_ok
        state: "on"
      - condition: not
        conditions:
          - condition: state
            entity_id: binary_sensor.dump_pv_falling
            state: "on"
      - condition: not
        conditions:
          - condition: state
            entity_id: binary_sensor.dump_load_exceeds_solar
            state: "on"
      - condition: template
        value_template: "{{ states('sensor.dump_next_plug').startswith('switch.ihoment_h5082_') }}"
    actions:
      - repeat:
          while:
            - condition: state
              entity_id: input_boolean.dump_control_enabled
              state: "on"
            - condition: state
              entity_id: binary_sensor.dump_charge_float
              state: "on"
            - condition: state
              entity_id: binary_sensor.dump_solar_present
              state: "on"
            - condition: state
              entity_id: binary_sensor.dump_soc_ok
              state: "on"
            - condition: not
              conditions:
                - condition: state
                  entity_id: binary_sensor.dump_pv_falling
                  state: "on"
            - condition: not
              conditions:
                - condition: state
                  entity_id: binary_sensor.dump_load_exceeds_solar
                  state: "on"
            - condition: template
              value_template: "{{ states('sensor.dump_next_plug').startswith('switch.ihoment_h5082_') and repeat.index <= 16 }}"
          sequence:
            - variables:
                target: "{{ states('sensor.dump_next_plug') }}"
                sock: "{{ states('sensor.dump_next_plug') | replace('switch.ihoment_h5082_', '') }}"
            - variables:
                bus: "{{ states('input_select.h5082_' ~ sock ~ '_inverter') }}"
            - variables:
                load_eid: "{{ 'sensor.dump_bus_load_t2' if bus == 'T2' else ('sensor.dump_bus_load_ku' if bus == 'KU' else 'sensor.dump_bus_load_sph') }}"
                volts_eid: "{{ 'sensor.battery_1_voltage' if bus == 'T2' else ('sensor.battery_2_voltage' if bus == 'KU' else 'sensor.sungold_sph302480a_battery_voltage') }}"
                start_v_eid: "{{ 'input_number.dump_float_t2_v' if bus == 'T2' else ('input_number.dump_float_ku_v' if bus == 'KU' else 'input_number.dump_float_sph_v') }}"
            - variables:
                load_before: "{{ states(load_eid) | float if is_number(states(load_eid)) else none }}"
            - condition: template
              value_template: "{{ (is_state('input_select.h5082_' ~ sock ~ '_use', 'dump') and not is_state('input_select.h5082_' ~ sock ~ '_inverter', 'House')) and states('timer.h5082_' ~ sock ~ '_hold') not in ['active', 'paused'] and not (is_state('input_select.h5082_' ~ sock ~ '_inverter', 'Sungold') and is_state('binary_sensor.dump_sph_vguard', 'on')) }}"
            # Live name for the logbook line: the socket's Load text and its plug's
            # Where text (input_text helpers you set in HA), else the plug id + side.
            # Nothing about what is plugged in is hard-coded here. Reused below.
            - &socket_label
              variables:
                label: >-
                  {%- set b = ['', 'unknown', 'unavailable', 'none'] -%}
                  {%- set p = sock[:4] -%}
                  {%- set tag = p | upper ~ ' ' ~ sock[5:] -%}
                  {%- set l = states('input_text.h5082_' ~ sock ~ '_load') | trim -%}
                  {%- set w = states('input_text.h5082_' ~ p ~ '_location') | trim -%}
                  {{ (l ~ ' (' ~ tag ~ ')') if l not in b else tag }}{{ (' at ' ~ w) if w not in b else '' }}
            - action: logbook.log
              data:
                name: Dump control
                entity_id: "{{ target }}"
                message: >-
                  {{ label }}: turning ON ({{ bus }} bus): charger in float, T2 PV
                  {{ states('sensor.dump_surplus_w') }} W, bus {{ states(volts_eid) }} V
                  >= start {{ states(start_v_eid) }} V, {{ bus }} load before
                  {{ load_before }} W.
                  {% if is_state('input_boolean.dump_skip_cooldown', 'on') %}Skip cooldown was on, so an active cooldown did not block this socket. The skip switch is now off.{% endif %}
            - if:
                - condition: state
                  entity_id: input_boolean.dump_skip_cooldown
                  state: "on"
              then:
                - action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.dump_skip_cooldown
            - event: dump_control_switching
              event_data:
                sock: "{{ sock }}"
                state: "on"
            - action: switch.turn_on
              target:
                entity_id: "{{ target }}"
            # The H5082 state only turns on after the plug acks over BLE (connect +
            # login + retries on a cold link). Start the site confirm from there.
            - wait_template: "{{ is_state(target, 'on') }}"
              timeout: "00:02:00"
              continue_on_timeout: true
            - variables:
                switched: "{{ wait.completed }}"
            - delay: "{{ states('input_number.dump_site_confirm_s') | int(5) }}"
            - variables:
                load_after: "{{ states(load_eid) | float if is_number(states(load_eid)) else none }}"
                delta_min: "{{ states('input_number.dump_site_delta_min_w') | float(25) }}"
            - variables:
                confirmed: >
                  {{ switched and is_number(load_before) and is_number(load_after)
                     and (load_after | float - load_before | float) >= (delta_min | float) }}
                rise: >-
                  {{ ((load_after | float - load_before | float) | round(0))
                     if is_number(load_before) and is_number(load_after) else 'unknown' }}
            - if:
                - condition: template
                  value_template: >
                    {{ not is_state('binary_sensor.dump_charge_float', 'on')
                       or not is_state('binary_sensor.dump_solar_present', 'on') }}
              then:
                - event: dump_control_switching
                  event_data:
                    sock: "{{ sock }}"
                    state: "off"
                - action: switch.turn_off
                  target:
                    entity_id: "{{ target }}"
                - action: timer.start
                  target:
                    entity_id: "timer.h5082_{{ sock }}_cooldown"
                - action: timer.cancel
                  target:
                    entity_id: "timer.h5082_{{ sock }}_min_on"
                - *socket_label
                - action: logbook.log
                  data:
                    name: Dump control
                    entity_id: "{{ target }}"
                    message: >-
                      {{ label }}: turned back OFF: charger left float or solar went away during the
                      confirm wait. Cooldown 10 min. Staging stopped.
                - stop: left float or solar gone
            - if:
                - condition: template
                  value_template: "{{ not confirmed }}"
              then:
                - event: dump_control_switching
                  event_data:
                    sock: "{{ sock }}"
                    state: "off"
                - action: switch.turn_off
                  target:
                    entity_id: "{{ target }}"
                - action: timer.start
                  target:
                    entity_id: "timer.h5082_{{ sock }}_cooldown"
                - *socket_label
                - action: logbook.log
                  data:
                    name: Dump control
                    entity_id: "{{ target }}"
                    message: >-
                      {{ label }}: turned back OFF: not confirmed. {{ 'Plug reported on' if switched
                      else 'Plug never reported on (2 min)' }}; {{ bus }} load rose
                      {{ rise }} W, needs {{ delta_min }} W. Cooldown 10 min.
                - delay: 1
              else:
                - action: timer.start
                  target:
                    entity_id: "timer.h5082_{{ sock }}_min_on"
                - *socket_label
                - action: logbook.log
                  data:
                    name: Dump control
                    entity_id: "{{ target }}"
                    message: >-
                      {{ label }}: kept ON: {{ bus }} load rose {{ rise }} W (needs {{ delta_min }} W).
                - delay: 1

  - id: dump_turn_off_solar_gone
    alias: "Dump OFF all: solar gone for 1 minute"
    description: >
      T2 MPPT PV below "Dump min solar" for 1 min (weather or end of day). Every dump
      socket that is not already off is turned off, its min-on cancelled and its cooldown
      started, so dump sockets never run as night loads (95%+ left in the packs).
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.dump_solar_present
        to: "off"
        for: "00:01:00"
    conditions:
      - condition: state
        entity_id: input_boolean.dump_control_enabled
        state: "on"
    actions:
      - variables:
          targets: >
            {% set ns = namespace(out=[]) %}
            {% for s in [
              '2f9d_left', '2f9d_right', '3013_left', '3013_right', '3ec9_left', '3ec9_right',
              '82fb_left', '82fb_right', '9607_left', '9607_right', 'c061_left', 'c061_right',
              'c38d_left', 'c38d_right', 'cf79_left', 'cf79_right'
            ] %}
              {% if (is_state('input_select.h5082_' ~ s ~ '_use', 'dump') and not is_state('input_select.h5082_' ~ s ~ '_inverter', 'House')) and (states('timer.h5082_' ~ s ~ '_hold') not in ['active', 'paused'] or not is_state('input_boolean.dump_hold_blocks_turn_off', 'on'))
                 and not is_state('switch.ihoment_h5082_' ~ s, 'off') %}
                {% set ns.out = ns.out + [s] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - event: dump_control_switching
              event_data:
                sock: "{{ repeat.item }}"
                state: "off"
            - action: switch.turn_off
              target:
                entity_id: "switch.ihoment_h5082_{{ repeat.item }}"
            - action: timer.cancel
              target:
                entity_id: "timer.h5082_{{ repeat.item }}_min_on"
            - action: timer.start
              target:
                entity_id: "timer.h5082_{{ repeat.item }}_cooldown"
            - variables:
                sock: "{{ repeat.item }}"
            - *socket_label
            - action: logbook.log
              data:
                name: Dump control
                entity_id: "switch.ihoment_h5082_{{ repeat.item }}"
                message: >-
                  {{ label }}: turned OFF by "Dump OFF all: solar gone for 1 minute": T2 PV {{ states('sensor.solar_controller_solar') }} W below Dump min solar {{ states('input_number.dump_min_solar_w') }} W for 1 min. Cooldown 10 min.

  - id: dump_turn_off_bulk
    alias: "Dump SHED one per minute: T2 charger left absorption/float"
    description: >
      T2 MPPT charge state not absorption or float for 1 min (clouds or a big load pulled
      it back to bulk). Sheds one dump socket per minute, last in the stage order first,
      until float returns or no dump socket is on. Not all at once, so the MPPT is not
      forced into a same-day float-idle cycle. Night/storm all-off is the solar-gone rule.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.dump_charge_ok
        to: "off"
        for: "00:01:00"
    conditions:
      - condition: state
        entity_id: input_boolean.dump_control_enabled
