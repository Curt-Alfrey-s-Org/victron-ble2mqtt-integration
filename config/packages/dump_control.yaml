# Dump-load CONTROL (HA owns on/off). Opt-in package for Home Assistant on .105.
# Drives the real Govee H5082 sockets (switch.ihoment_h5082_<id>_<side>, MQTT from
# govee_h5082 on the Pi 4). A socket is a dump socket only while its
# input_select.h5082_<id>_<side>_use is "dump" (helpers from
# scripts/create_h5082_socket_labels.py, default "normal"). A "normal" socket is never
# turned on or off by these automations. See docs/DUMP_LOAD_HA_CONTROL.md.
# All 8 plugs / 16 sockets are in the socket lists (C38D was paired 2026-09-28 and
# added after 2F9D ... C061, before CF79). What is plugged into each socket and where
# each plug sits are NOT written here: they are the input_text Where / Load helpers
# you set in HA (Site solar > Plug names), and the logbook lines read them live.
# Stage/shed order is the list order below (stage first, shed last-first).
# Victron float hold then staged ON (site load delta, 15 min min-on, 10 min cooldown).
# Solar-gone and re-bulk OFF (1 minute). Shed one dump plug when Sungold load > site solar.
# Notify when that overdraw lasts 10 minutes (Companion or persistent).
# Surplus watts (dump_surplus_w) are briefing only -- not the ON trigger.
# Every switch action also writes a plain reason to the logbook ("Dump control ..."),
# shown on Site solar > Dump activity log. Helpers have no `initial:` (see below).
# Official:
#   https://www.home-assistant.io/docs/configuration/packages/
#   https://www.home-assistant.io/docs/automation/yaml/
#   https://www.home-assistant.io/integrations/threshold/
#   https://www.home-assistant.io/docs/automation/trigger/
#   https://www.home-assistant.io/integrations/timer/
#   https://www.home-assistant.io/integrations/derivative/
#   https://www.home-assistant.io/integrations/template/
#   https://www.home-assistant.io/integrations/switch/
#   https://www.home-assistant.io/integrations/input_number/
#   https://www.home-assistant.io/integrations/input_select/
#   https://www.home-assistant.io/integrations/input_text/
#   https://www.home-assistant.io/integrations/notify/
#   https://www.home-assistant.io/docs/scripts/
#   https://www.home-assistant.io/docs/automation/trigger/#template-trigger
#   https://www.home-assistant.io/triggers/homeassistant/
#   https://www.home-assistant.io/triggers/event/
#   https://www.home-assistant.io/docs/configuration/events/
# Victron 1-minute re-bulk:
#   https://www.victronenergy.com/media/pg/Manual_BlueSolar_MPPT_75-10_up_to_100-20/en/operation.html
# SmartShunt +charge / -discharge:
#   https://www.victronenergy.com/media/pg/SmartShunt/en/operation.html

# Settings persistence (2026-09-28): NO helper in this package has `initial:`.
# With `initial:` Home Assistant puts the YAML value back at every restart and throws
# away the value you set in the UI (input_* async_added_to_hass only restores the last
# state when initial is unset; https://www.home-assistant.io/integrations/input_number/).
# Without it HA restores the last value from .storage/core.restore_state.
# Recommended starting values live in docs/site-solar/*.md and in
# script.dump_load_recommended_defaults (manual button, never automatic).
# A brand-new install starts numbers at their minimum and the kill switch OFF:
# press the defaults button once, check the values, then enable dump control.

# Load the logbook integration: every dump rule writes its reason with logbook.log and
# Site solar shows it in the Dump activity log. This HA has no default_config, and a
# missing logbook.log action would stop a rule mid-way. An empty key merges with any
# logbook: already in configuration.yaml. https://www.home-assistant.io/integrations/logbook/
logbook:

input_boolean:
  dump_control_enabled:
