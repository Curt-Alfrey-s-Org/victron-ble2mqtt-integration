# Dump-load plugs -- template switches until real power-reporting smart plugs.
# When hardware is added (official Shelly integration), rename the device switch
# to switch.sim_ac_plug_N and set input_text.dump_plug_N_power_entity to that
# device's power sensor. HA dump staging uses live watts, not typed ratings.
# Official:
#   https://www.home-assistant.io/integrations/template/
#   https://www.home-assistant.io/integrations/input_boolean/
#   https://www.home-assistant.io/integrations/input_text/
#   https://www.home-assistant.io/docs/configuration/packages/
#   https://www.home-assistant.io/integrations/shelly/
# unique_id + default_entity_id: https://www.home-assistant.io/integrations/template/

input_boolean:
  sim_ac_plug_1_internal:
    name: Dump plug 1 (internal)
  sim_ac_plug_2_internal:
    name: Dump plug 2 (internal)
  sim_ac_plug_3_internal:
    name: Dump plug 3 (internal)
  sim_ac_plug_4_internal:
    name: Dump plug 4 (internal)
  sim_ac_plug_5_internal:
    name: Dump plug 5 (internal)
  sim_ac_plug_6_internal:
    name: Dump plug 6 (internal)

input_text:
  dump_plug_1_power_entity:
    name: Plug 1 live power entity
    max: 64
    pattern: "^$|^sensor\\.[a-z0-9_]+$"
    icon: mdi:flash
  dump_plug_2_power_entity:
    name: Plug 2 live power entity
    max: 64
    pattern: "^$|^sensor\\.[a-z0-9_]+$"
    icon: mdi:flash
  dump_plug_3_power_entity:
    name: Plug 3 live power entity
    max: 64
    pattern: "^$|^sensor\\.[a-z0-9_]+$"
    icon: mdi:flash
  dump_plug_4_power_entity:
    name: Plug 4 live power entity
    max: 64
    pattern: "^$|^sensor\\.[a-z0-9_]+$"
    icon: mdi:flash
  dump_plug_5_power_entity:
    name: Plug 5 live power entity
    max: 64
    pattern: "^$|^sensor\\.[a-z0-9_]+$"
    icon: mdi:flash
  dump_plug_6_power_entity:
    name: Plug 6 live power entity
    max: 64
    pattern: "^$|^sensor\\.[a-z0-9_]+$"
    icon: mdi:flash

template:
  - switch:
      - name: Dump plug 1
        unique_id: sim_ac_plug_1
        default_entity_id: switch.sim_ac_plug_1
        state: "{{ is_state('input_boolean.sim_ac_plug_1_internal', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sim_ac_plug_1_internal
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sim_ac_plug_1_internal
      - name: Dump plug 2
        unique_id: sim_ac_plug_2
        default_entity_id: switch.sim_ac_plug_2
        state: "{{ is_state('input_boolean.sim_ac_plug_2_internal', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sim_ac_plug_2_internal
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sim_ac_plug_2_internal
      - name: Dump plug 3
        unique_id: sim_ac_plug_3
        default_entity_id: switch.sim_ac_plug_3
        state: "{{ is_state('input_boolean.sim_ac_plug_3_internal', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sim_ac_plug_3_internal
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sim_ac_plug_3_internal
      - name: Dump plug 4
        unique_id: sim_ac_plug_4
        default_entity_id: switch.sim_ac_plug_4
        state: "{{ is_state('input_boolean.sim_ac_plug_4_internal', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sim_ac_plug_4_internal
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sim_ac_plug_4_internal
      - name: Dump plug 5
        unique_id: sim_ac_plug_5
        default_entity_id: switch.sim_ac_plug_5
        state: "{{ is_state('input_boolean.sim_ac_plug_5_internal', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sim_ac_plug_5_internal
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sim_ac_plug_5_internal
      - name: Dump plug 6
        unique_id: sim_ac_plug_6
        default_entity_id: switch.sim_ac_plug_6
        state: "{{ is_state('input_boolean.sim_ac_plug_6_internal', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sim_ac_plug_6_internal
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sim_ac_plug_6_internal
  - sensor:
      - name: Dump plug 1 power
        unique_id: sim_ac_plug_1_power
        default_entity_id: sensor.sim_ac_plug_1_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% if is_state('switch.sim_ac_plug_1', 'on') %}
            {% set src = states('input_text.dump_plug_1_power_entity') | trim %}
            {% if src and is_number(states(src)) %}
              {{ states(src) | float }}
            {% else %}
              {{ none }}
            {% endif %}
          {% else %}
            0
          {% endif %}
      - name: Dump plug 2 power
        unique_id: sim_ac_plug_2_power
        default_entity_id: sensor.sim_ac_plug_2_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% if is_state('switch.sim_ac_plug_2', 'on') %}
            {% set src = states('input_text.dump_plug_2_power_entity') | trim %}
            {% if src and is_number(states(src)) %}
              {{ states(src) | float }}
            {% else %}
              {{ none }}
            {% endif %}
          {% else %}
            0
          {% endif %}
      - name: Dump plug 3 power
        unique_id: sim_ac_plug_3_power
        default_entity_id: sensor.sim_ac_plug_3_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% if is_state('switch.sim_ac_plug_3', 'on') %}
            {% set src = states('input_text.dump_plug_3_power_entity') | trim %}
            {% if src and is_number(states(src)) %}
              {{ states(src) | float }}
            {% else %}
              {{ none }}
            {% endif %}
          {% else %}
            0
          {% endif %}
      - name: Dump plug 4 power
        unique_id: sim_ac_plug_4_power
        default_entity_id: sensor.sim_ac_plug_4_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% if is_state('switch.sim_ac_plug_4', 'on') %}
            {% set src = states('input_text.dump_plug_4_power_entity') | trim %}
            {% if src and is_number(states(src)) %}
              {{ states(src) | float }}
            {% else %}
              {{ none }}
            {% endif %}
          {% else %}
            0
          {% endif %}
      - name: Dump plug 5 power
        unique_id: sim_ac_plug_5_power
        default_entity_id: sensor.sim_ac_plug_5_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% if is_state('switch.sim_ac_plug_5', 'on') %}
            {% set src = states('input_text.dump_plug_5_power_entity') | trim %}
            {% if src and is_number(states(src)) %}
              {{ states(src) | float }}
            {% else %}
              {{ none }}
            {% endif %}
          {% else %}
            0
          {% endif %}
      - name: Dump plug 6 power
        unique_id: sim_ac_plug_6_power
        default_entity_id: sensor.sim_ac_plug_6_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% if is_state('switch.sim_ac_plug_6', 'on') %}
            {% set src = states('input_text.dump_plug_6_power_entity') | trim %}
            {% if src and is_number(states(src)) %}
              {{ states(src) | float }}
            {% else %}
              {{ none }}
            {% endif %}
          {% else %}
            0
          {% endif %}
      - name: Sim dump load power
        unique_id: sim_dump_load_power
        default_entity_id: sensor.sim_dump_load_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set ns = namespace(total=0) %}
          {% for n in [1, 2, 3, 4, 5, 6] %}
            {% set p = states('sensor.sim_ac_plug_' ~ n ~ '_power') %}
            {% if is_number(p) %}
              {% set ns.total = ns.total + (p | float) %}
            {% endif %}
          {% endfor %}
          {{ ns.total }}
