# Solar plant helpers for Home Assistant on .105
# Live W templates + Riemann kWh for the Energy dashboard / power-sankey.
# Official: https://www.home-assistant.io/integrations/template/
#           https://www.home-assistant.io/integrations/integration/
#           https://www.home-assistant.io/integrations/rest/
#           https://www.home-assistant.io/docs/configuration/packages/
# Physics: docs/SOLAR_POWER_BALANCE.md (jumper shunt-to-shunt leftover, KU equal-share est.)
# NWS: https://www.weather.gov/documentation/services-web-api (User-Agent required)
# This package is read-only sensors. Dump on/off is sim_dump_control.yaml.

# Watauga Lake / Hampton TN. NWS points 36.32,-82.12 -> radarStation KMRX, county TNC019.
rest:
  - resource: https://api.weather.gov/alerts/active?point=36.32,-82.12
    scan_interval: 300
    timeout: 20
    headers:
      User-Agent: victron-ble2mqtt-integration (https://github.com/Curt-Alfrey-s-Org/victron-ble2mqtt-integration)
      Accept: application/geo+json
    sensor:
      - name: NWS Watauga Lake alerts
        unique_id: nws_watauga_lake_alerts
        value_template: >-
          {% set feats = value_json.features | default([]) %}
          {% if feats | length == 0 %}
            None
          {% else %}
            {{ (feats | map(attribute='properties.event') | list | unique | list | join(', '))[:250] }}
          {% endif %}

template:
  - sensor:
      - name: T2-KU jumper power
        unique_id: t2_ku_jumper_power
        default_entity_id: sensor.t2_ku_jumper_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.solar_controller_solar')) and is_number(states('sensor.battery_1_power')) }}"
        state: "{{ (states('sensor.solar_controller_solar') | float(0)) - (states('sensor.battery_1_power') | float(0)) }}"
        attributes:
          t2_solar_w: "{{ states('sensor.solar_controller_solar') | float(0) }}"
          batt1_w: "{{ states('sensor.battery_1_power') | float(0) }}"
          note: shunt-to-shunt leftover; already in batt1 and batt2

      # T2 glance sign only. Canonical jumper stays + = T2->KU for KU PV / History.
      # https://www.home-assistant.io/integrations/template/
      - name: T2-KU jumper at T2
        unique_id: t2_ku_jumper_at_t2_power
        default_entity_id: sensor.t2_ku_jumper_at_t2_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.t2_ku_jumper_power')) }}"
        state: "{{ -(states('sensor.t2_ku_jumper_power') | float(0)) }}"

      - name: Trailer outlet power
        unique_id: trailer_outlet_power
        default_entity_id: sensor.trailer_outlet_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.em16_a3_power')) or is_number(states('sensor.em16_b3_power')) }}"
        state: >-
          {% if is_number(states('sensor.em16_b3_power')) and (states('sensor.em16_b3_power') | float | abs) >= 0.5 %}
            {{ states('sensor.em16_b3_power') | float | abs }}
          {% elif is_number(states('sensor.em16_a3_power')) %}
            {{ states('sensor.em16_a3_power') | float | abs }}
          {% else %}
            unknown
          {% endif %}

      # Sungold UTI on KU Renogy trailer outlet: Renogy DC load is at least max(CT, UTI).
      # Vent fan and LEDs are on SPH AC out (not a sibling on A3 anymore).
      - name: KU Renogy AC load power
        unique_id: ku_renogy_ac_load_power
        default_entity_id: sensor.ku_renogy_ac_load_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.trailer_outlet_power'))
             or is_number(states('sensor.sungold_uti_va_power')) }}
        state: >-
          {% set tr = states('sensor.trailer_outlet_power') | float(0)
             if is_number(states('sensor.trailer_outlet_power')) else 0 %}
          {% set uti = states('sensor.sungold_uti_va_power') | float(0)
             if is_number(states('sensor.sungold_uti_va_power')) else 0 %}
          {{ [tr, uti] | max }}
        attributes:
          trailer_ct_w: >-
            {{ states('sensor.trailer_outlet_power') | float(0)
               if is_number(states('sensor.trailer_outlet_power')) else none }}
          sungold_uti_w: >-
            {{ states('sensor.sungold_uti_va_power') | float(0)
               if is_number(states('sensor.sungold_uti_va_power')) else none }}
          note: max EM16 A3/B3 and SPH grid V*A; inverter DC in >= AC INPUT

      # SPH AC-out is all house loads (T2 Renogy idle). Cart/PV only supply
      # the surplus of AC-out over KU UTI/CT. 0 in mains bypass.
      # https://www.solaris-shop.com/content/3000W_SPH302480A_20231128.pdf
      - name: Sungold cart to load power
        unique_id: sungold_cart_to_load_power
        default_entity_id: sensor.sungold_cart_to_load_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.sungold_sph302480a_load_power')) }}"
        state: >-
          {% set load = states('sensor.sungold_sph302480a_load_power') | float(0)
             if is_number(states('sensor.sungold_sph302480a_load_power')) else 0 %}
          {% set ku = states('sensor.ku_renogy_ac_load_power') | float(0)
             if is_number(states('sensor.ku_renogy_ac_load_power')) else 0 %}
          {{ [load - ku, 0] | max }}
        attributes:
          sph_ac_out_w: "{{ states('sensor.sungold_sph302480a_load_power') }}"
          ku_feed_w: "{{ states('sensor.ku_renogy_ac_load_power') }}"
          cart_batt_w: "{{ states('sensor.sungold_sph302480a_charging_power') }}"
          cart_batt_a: "{{ states('sensor.sungold_sph302480a_battery_current') }}"
          note: max(0, SPH AC-out - KU UTI/CT); 0 means KU feeds the whole house load

      # Isolate KU PV: subtract shunt-to-shunt leftover already in Battery 2.
      - name: KU unmetered PV est power
        unique_id: ku_unmetered_pv_est_power
        default_entity_id: sensor.ku_unmetered_pv_est_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.battery_2_power'))
             and is_number(states('sensor.t2_ku_jumper_power'))
             and is_number(states('sensor.ku_renogy_ac_load_power')) }}
        state: >-
          {{ (states('sensor.battery_2_power') | float(0))
             - (states('sensor.t2_ku_jumper_power') | float(0))
             + (states('sensor.ku_renogy_ac_load_power') | float(0)) }}
        attributes:
          ku_renogy_ac_w: "{{ states('sensor.ku_renogy_ac_load_power') }}"
          batt2_w: "{{ states('sensor.battery_2_power') }}"
          jumper_w: "{{ states('sensor.t2_ku_jumper_power') }}"

      - name: KU charger equal share power
        unique_id: ku_charger_equal_share_power
        default_entity_id: sensor.ku_charger_equal_share_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.ku_unmetered_pv_est_power')) }}"
        state: "{{ (states('sensor.ku_unmetered_pv_est_power') | float(0)) / 3 }}"

      - name: Battery 1 charge power
        unique_id: battery_1_charge_power
        default_entity_id: sensor.battery_1_charge_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.battery_1_power')) }}"
        state: "{{ [states('sensor.battery_1_power') | float(0), 0] | max }}"

      - name: Battery 1 discharge power
        unique_id: battery_1_discharge_power
        default_entity_id: sensor.battery_1_discharge_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.battery_1_power')) }}"
        state: "{{ [-(states('sensor.battery_1_power') | float(0)), 0] | max }}"

      - name: Battery 2 charge power
        unique_id: battery_2_charge_power
        default_entity_id: sensor.battery_2_charge_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.battery_2_power')) }}"
        state: "{{ [states('sensor.battery_2_power') | float(0), 0] | max }}"

      - name: Battery 2 discharge power
        unique_id: battery_2_discharge_power
        default_entity_id: sensor.battery_2_discharge_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.battery_2_power')) }}"
        state: "{{ [-(states('sensor.battery_2_power') | float(0)), 0] | max }}"

      # Conversion losses only (docs/SOLAR_POWER_BALANCE.md combined_losses_w).
      # T2 MPPT: solar_W - charge_W - load_W; skip when charge 0/missing and jumper flowing.
      - name: T2 MPPT conversion loss
        unique_id: t2_mppt_conversion_loss_power
        default_entity_id: sensor.t2_mppt_conversion_loss_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.solar_controller_solar')) }}"
        state: >-
          {% set solar = states('sensor.solar_controller_solar') | float(0) %}
          {% set charge = states('sensor.solar_controller_charging_power') | float(0)
             if is_number(states('sensor.solar_controller_charging_power')) else none %}
          {% set load = states('sensor.solar_controller_load_power') | float(0)
             if is_number(states('sensor.solar_controller_load_power')) else 0 %}
          {% set batt1 = states('sensor.battery_1_power') | float(0)
             if is_number(states('sensor.battery_1_power')) else none %}
          {% set jumper = (solar - batt1) if batt1 is not none else none %}
          {% set jumper_flowing = jumper is not none and (jumper | abs) >= 1 %}
          {% if charge is not none and (charge > 0.5 or not jumper_flowing) %}
            {% set mppt_out = charge + load %}
            {{ [solar - mppt_out, 0] | max }}
          {% else %}
            0
          {% endif %}

      # Sungold: SG_loss = (UTI V*A + SG_PV) - SG_batt_in - SG_AC_out (nonnegative).
      # 0 V*A is valid AC INPUT while inverting. Do not substitute AC-out.
      # https://www.solaris-shop.com/content/3000W_SPH302480A_20231128.pdf
      - name: Sungold UTI V times A
        unique_id: sungold_uti_va_power
        default_entity_id: sensor.sungold_uti_va_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.sungold_sph302480a_grid_voltage'))
             and is_number(states('sensor.sungold_sph302480a_grid_current')) }}
        state: >-
          {{ ((states('sensor.sungold_sph302480a_grid_voltage') | float(0))
              * (states('sensor.sungold_sph302480a_grid_current') | float(0))) | abs }}

      - name: Sungold AC out V times A
        unique_id: sungold_ac_out_va_power
        default_entity_id: sensor.sungold_ac_out_va_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.sungold_sph302480a_ac_output_voltage'))
             and is_number(states('sensor.sungold_sph302480a_load_current')) }}
        state: >-
          {{ ((states('sensor.sungold_sph302480a_ac_output_voltage') | float(0))
              * (states('sensor.sungold_sph302480a_load_current') | float(0))) | abs }}

      - name: Sungold conversion loss
        unique_id: sungold_conversion_loss_power
        default_entity_id: sensor.sungold_conversion_loss_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_number(states('sensor.sungold_uti_va_power')) }}"
        state: >-
          {% set sg_ac_in = states('sensor.sungold_uti_va_power') | float(0)
             if is_number(states('sensor.sungold_uti_va_power')) else none %}
          {% set sg_load = states('sensor.sungold_sph302480a_load_power') | float(0)
             if is_number(states('sensor.sungold_sph302480a_load_power')) else none %}
          {% set sg_pv = states('sensor.sungold_sph302480a_pv_power') | float(0)
             if is_number(states('sensor.sungold_sph302480a_pv_power')) else 0 %}
          {% set sg_batt = states('sensor.sungold_sph302480a_charging_power') | float(0)
             if is_number(states('sensor.sungold_sph302480a_charging_power')) else none %}
          {% if sg_ac_in is not none and (sg_batt is not none or sg_load is not none) %}
            {% set sg_in = sg_ac_in + sg_pv %}
            {% set sg_out = (sg_batt | default(0, true)) + (sg_load | default(0, true)) %}
            {{ [sg_in - sg_out, 0] | max }}
          {% else %}
            0
          {% endif %}

      - name: Solar component losses
        unique_id: solar_component_losses_power
        default_entity_id: sensor.solar_component_losses_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.t2_mppt_conversion_loss_power'))
             and is_number(states('sensor.sungold_conversion_loss_power')) }}
        state: >-
          {{ (states('sensor.t2_mppt_conversion_loss_power') | float(0))
             + (states('sensor.sungold_conversion_loss_power') | float(0)) }}

      - name: Site solar power
        unique_id: site_solar_power
        default_entity_id: sensor.site_solar_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.solar_controller_solar'))
             or is_number(states('sensor.sungold_sph302480a_pv_power'))
             or is_number(states('sensor.ku_unmetered_pv_est_power')) }}
        state: >-
          {{ (states('sensor.solar_controller_solar') | float(0)
              if is_number(states('sensor.solar_controller_solar')) else 0)
             + (states('sensor.sungold_sph302480a_pv_power') | float(0)
                if is_number(states('sensor.sungold_sph302480a_pv_power')) else 0)
             + ([states('sensor.ku_unmetered_pv_est_power') | float(0)
                if is_number(states('sensor.ku_unmetered_pv_est_power')) else 0, 0] | max) }}
        attributes:
          t2_w: >-
            {{ states('sensor.solar_controller_solar') | float(0)
               if is_number(states('sensor.solar_controller_solar')) else 0 }}
          sph_pv_w: >-
            {{ states('sensor.sungold_sph302480a_pv_power') | float(0)
               if is_number(states('sensor.sungold_sph302480a_pv_power')) else 0 }}
          ku_est_w: >-
            {{ states('sensor.ku_unmetered_pv_est_power') | float(0)
               if is_number(states('sensor.ku_unmetered_pv_est_power')) else 0 }}
          ku_clamped_w: >-
            {{ [states('sensor.ku_unmetered_pv_est_power') | float(0)
                if is_number(states('sensor.ku_unmetered_pv_est_power')) else 0, 0] | max }}

      - name: Site charge power
        unique_id: site_charge_power
        default_entity_id: sensor.site_charge_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.battery_1_charge_power'))
             or is_number(states('sensor.battery_2_charge_power'))
             or is_number(states('sensor.sungold_sph302480a_charging_power')) }}
        state: >-
          {{ (states('sensor.battery_1_charge_power') | float(0)
              if is_number(states('sensor.battery_1_charge_power')) else 0)
             + (states('sensor.battery_2_charge_power') | float(0)
                if is_number(states('sensor.battery_2_charge_power')) else 0)
             + ([states('sensor.sungold_sph302480a_charging_power') | float(0)
                if is_number(states('sensor.sungold_sph302480a_charging_power')) else 0, 0] | max) }}

sensor:
  - platform: integration
    source: sensor.solar_controller_solar
    name: T2 MPPT energy kWh
    unique_id: t2_mppt_energy_kwh
    unit_prefix: k
    round: 3
    method: left
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.battery_1_charge_power
    name: Battery 1 charge energy kWh
    unique_id: battery_1_charge_energy_kwh
    unit_prefix: k
    round: 3
    method: left
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.battery_1_discharge_power
    name: Battery 1 discharge energy kWh
    unique_id: battery_1_discharge_energy_kwh
    unit_prefix: k
    round: 3
    method: left
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.battery_2_charge_power
    name: Battery 2 charge energy kWh
    unique_id: battery_2_charge_energy_kwh
    unit_prefix: k
    round: 3
    method: left
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.battery_2_discharge_power
    name: Battery 2 discharge energy kWh
    unique_id: battery_2_discharge_energy_kwh
    unit_prefix: k
    round: 3
    method: left
    max_sub_interval:
      minutes: 5
  # Sungold A/C-in kWh: trailer_outlet_power is abs(W). Do not integrate signed
  # sensor.em16_a3_power -- Energy individual devices require a nonnegative state
  # https://www.home-assistant.io/integrations/integration/#energy
  - platform: integration
    source: sensor.trailer_outlet_power
    name: EM16 A3 energy kWh
    unique_id: em16_a3_energy_kwh
    unit_prefix: k
    round: 3
    method: left
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.sim_dump_load_power
    name: Sim dump energy kWh
    unique_id: sim_dump_energy_kwh
    unit_prefix: k
    round: 3
    method: left
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.sungold_sph302480a_load_power
    name: Sungold load energy kWh
    unique_id: sungold_load_energy_kwh
    unit_prefix: k
    round: 3
    method: left
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.site_solar_power
    name: Site solar energy kWh
    unique_id: site_solar_energy_kwh
    unit_prefix: k
    round: 3
    method: left
    max_sub_interval:
      minutes: 5
  - platform: integration
    source: sensor.site_charge_power
    name: Site charge energy kWh
    unique_id: site_charge_energy_kwh
    unit_prefix: k
    round: 3
    method: left
    max_sub_interval:
      minutes: 5

# Calendar-day kWh for Site totals tiles (same source as *_energy_kwh integrals).
# Statistic-card "change" can disagree with the integration state; use these for Today.
# https://www.home-assistant.io/integrations/utility_meter/
utility_meter:
  site_solar_today:
    source: sensor.site_solar_energy_kwh
    name: Site solar today
    unique_id: site_solar_today_kwh
    cycle: daily
  site_charge_today:
    source: sensor.site_charge_energy_kwh
    name: Site charge today
    unique_id: site_charge_today_kwh
    cycle: daily
  sungold_load_today:
    source: sensor.sungold_load_energy_kwh
    name: Sungold load today
    unique_id: sungold_load_today_kwh
    cycle: daily
