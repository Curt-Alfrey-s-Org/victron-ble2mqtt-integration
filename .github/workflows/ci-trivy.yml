name: CI — tests & trivy

on:
  push:
    branches: [ main, '**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run tests (with Mosquitto)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          # tests/ also cover sungold (minimalmodbus, pyserial), bms_supervisor
          # (pyserial) and the HA YAML packages (pyyaml); versions follow
          # pyproject.toml [dependency-groups] dev.
          pip install -r sungold/requirements.txt -r bms_supervisor/requirements.txt
          pip install 'pytest>=9' 'pyyaml>=6'

      # A GitHub `services:` container cannot take a command, and
      # eclipse-mosquitto 2.x without a config only listens on loopback inside
      # the container, so the integration tests never saw a broker. The image
      # ships /mosquitto-no-auth.conf (listener 1883, anonymous) for this case.
      # https://hub.docker.com/_/eclipse-mosquitto
      - name: Start Mosquitto
        run: |
          docker run -d --name mosquitto -p 1883:1883 eclipse-mosquitto:2.0 \
            mosquitto -c /mosquitto-no-auth.conf
          for i in {1..20}; do
            nc -z localhost 1883 && echo "mosquitto up" && exit 0
            echo "waiting for mosquitto ($i)"; sleep 2
          done
          docker logs mosquitto
          exit 1

      - name: Run tests
        env:
          MQTT_HOST: localhost
        run: pytest -q

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy (filesystem)
        # v1 tag does not exist (project uses v0.x; v-prefix since their 2026
        # supply-chain response) — the scan job has been failing silently.
        # https://github.com/aquasecurity/trivy-action/releases
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
